vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-06
    alt_attention: false
  odom_decoder:
    hidden_size: 192
    num_hidden_layers: 1
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: mean
objective:
  type: odom_finetune_nymeria_real_wrist_worldframe_flu
  odom_finetune_nymeria_real_wrist_worldframe_flu:
    pretrained_run: vit1d_ssl_focal_multidata
    pretrained_ckpt: /gpfs/home/vbc1591/IMU-SSL/runs/vit1d_ssl_focal_multidata/checkpoints/best.pt
    train_pkl_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
    train_files:
    - /projects/b53017/vbc1591/processed_data_body_Ty_rwrist/20230607_s0_james_johnson_act1_7xwm28_cpfbody_rwrist_imu50hz_wristimu50hz_pose50hz.pkl
    - /projects/b53017/vbc1591/processed_data_body_Ty_rwrist/20230607_s0_james_johnson_act2_yhbvpa_cpfbody_rwrist_imu50hz_wristimu50hz_pose50hz.pkl
    val_pkl_root: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
    val_files:
    - /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist/20230607_s0_james_johnson_act3_ifj2gc_cpfbody_rwrist_imu50hz_wristimu50hz_pose50hz.pkl
    add_gravity: true
    freeze_encoder: true
paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/bench/generated/tmp/runs
trainer:
  seed: 42
  amp: false
  max_steps: 4
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 2
  optim:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
  sched:
    name: cosine
    warmup_steps: 500
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
    min_delta: 0.0001
logging:
  log_every_steps: 5
  ckpt_every_steps: 1000
  save_step_checkpoints: false
wandb:
  mode: disabled
bench:
  task: odometry_nymeria_worldframe
  encoder: focal
  protocol: probe
  seed: 42
  template: configs/vit1d_odom_worldframe_finetune_nymeria_mae_multidata_flu.yaml
  registry_version: 1
data:
  batch_size: 8
  eval_batch_size: 8
  num_workers: 0
