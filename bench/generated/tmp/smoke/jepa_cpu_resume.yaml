vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  encoder:
    hidden_size: 96
    num_hidden_layers: 2
    num_attention_heads: 3
    intermediate_size: 384
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-06
    alt_attention: false
  max_patches_per_channel: 256
  pooling: mean
  pos_embed_type: 2d
  decoder:
    hidden_size: 192
    num_hidden_layers: 4
    num_attention_heads: 4
    intermediate_size: 768
  jepa_predictor:
    hidden_size: 48
    num_hidden_layers: 1
    num_attention_heads: 2
    mlp_ratio: 4.0
objective:
  type: mae_multidata_varlen_altattn_flu
  mae_multidata_varlen_altattn_flu:
    ssl_method: jepa
    cache_dir: /projects/b53017/vbc1591/mae_multidata_cache
    sampling_mode: natural
    sources:
      realdata:
        enabled: true
        train_on_datasets:
        - pamap2
        - recofit
        - samosa
        - shoaib
        - ut_watch
        - utd_mhad
        - wisdm
        max_windows: 320
      ocdetect:
        enabled: true
        data_dir: /projects/b53017/vbc1591/OCDetect_extracted/preprocessed
        splits:
        - 0.8
        - 0.1
        - 0.1
        max_hours: 100000.0
        max_files: null
        max_windows: 320
      nymeria:
        enabled: false
      totalcapture:
        enabled: false
      imuposer:
        enabled: false
      eatingspeed:
        enabled: true
        root: /projects/b53017/vbc1591/EatingSpeed
        subsets:
        - FD-I
        - FD-II
        - MO
        splits:
        - 0.8
        - 0.1
        - 0.1
        max_windows: 320
      motionx:
        enabled: true
        root: /projects/b53017/vbc1591/Motion-Xplusplus
        val_frac: 0.05
        add_gravity: true
        max_windows: 320
      humanml3d:
        enabled: false
      sonic:
        enabled: true
        root: /projects/b53017/vbc1591/bones-seed
        add_gravity: true
        max_windows: 320
      capture24:
        enabled: false
      openwatch:
        enabled: false
      nhanes:
        enabled: false
  jepa:
    ema_momentum: 0.996
    n_targets: 4
    target_scale:
    - 0.15
    - 0.2
    context_scale:
    - 0.85
    - 1.0
    max_target_frac: 0.75
data:
  batch_size: 8
  eval_batch_size: 8
  num_workers: 0
  pin_memory: true
  dataset_column: dataset
  label_column: dataset_activity_id
  label_name_column: dataset_activity_label
  session_column: session_id
  subject_column: subject_id
  time_column: timestamp_ns
  drop_na: false
  variable_length:
    enabled: true
    min_samples: 64
    max_samples: 512
paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs
preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-06
random_rotation:
  enabled: true
  rotation_set: octahedral
axis_bias:
  enabled: false
gain_jitter:
  enabled: false
gaussian_noise:
  enabled: false
time_warp:
  enabled: false
splits:
  group_key: subject_id
  seed: 42
  shuffle: true
  test_ratio: 0
  val_ratio: 0.05
windowing:
  window_seconds: 10.24
  window_hop_ratio: 0.5
  label_policy: center
  majority_threshold: 0.8
  handle_gaps: true
  gap_method: interpolate
  max_gap_ms: 200
  max_gaps_per_session: 100
trainer:
  seed: 42
  amp: false
  max_steps: 12
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 4
  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
  sched:
    name: cosine
    warmup_steps: 2
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 10
    min_delta: 0.0001
logging:
  log_every_steps: 1
  ckpt_every_steps: 4
  save_step_checkpoints: false
wandb:
  mode: disabled
