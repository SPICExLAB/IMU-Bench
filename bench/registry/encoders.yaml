  inertia1_patchtst:
    name: Inertia-1 PatchTST-small (NHANES repro)
    short: Inertia-1 PT
    group: foundation
    order: 110
    external: false
    external_encoder: inertia1
    variant: patchtst
    run: inertia1_patchtst_small_nhanes
    ckpt: best
    channels: 3
    params_m: 8.5
    pretrain_data: NHANES 2011-14 wrist accelerometry, 30 s @ 20 Hz, g units (our
      1/3-hour subsample of all 14,693 participants)
    pretrain_objective: PatchTST masked patch reconstruction (mask 0.4, patch 10)
    tasks:
    - arm_pose_nymeria
    - full_body_pose_nymeria
    - odometry_nymeria_worldframe
    - microgesture_openwatch
    - language_humanml3d
    - parkinsons_pads
    source: baselines/inertia1
    config_dir: configs/inertia1
    hide_in_summary: true
  inertia1_art:
    name: Inertia-1 AR-Transformer-small (NHANES repro)
