encoders:
  mae_11src:
    name: "Ours (MAE, 11-source) \u26A0 eval-overlap pool"
    short: MAE
    group: ours
    order: 0
    run: vit1d_ssl_mae_varlen_altattn_multidata
    ckpt: best
    alt_attention: true
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: 11-source multidata cache (mae_multidata_cache)
    pretrain_objective: MAE (var-len, alt-attn)
    hide_in_summary: false
    _hidden_note: pretrained on a pool that overlaps the evaluation sets; kept in the coverage grid and
      per-task detail, out of the headline tables
  mae_5src:
    name: "Ours (MAE, 5-source) \u26A0 eval-overlap pool"
    short: MAE-5src
    group: ours
    order: 1
    run: vit1d_ssl_mae_varlen_altattn_realdata_ocdetect_eatingspeed_motionx_sonic
    ckpt: best
    alt_attention: true
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: realdata, ocdetect, eatingspeed, motionx, sonic (5-source; Nymeria/TotalCapture genuinely
      held out)
    pretrain_objective: MAE (var-len, alt-attn)
    normalize_method: zscore
    preprocess_from: configs/vit1d_ssl_mae_varlen_altattn_realdata_ocdetect_eatingspeed_motionx_sonic_flu.yaml
    hide_in_summary: false
    _hidden_note: pretrained on a pool that overlaps the evaluation sets; kept in the coverage grid and
      per-task detail, out of the headline tables
