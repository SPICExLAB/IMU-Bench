encoders:
  mae_11src:
    name: Ours (MAE, 11-source)
    short: MAE
    group: ours
    order: 0
    run: vit1d_ssl_mae_varlen_altattn_multidata
    ckpt: best
    alt_attention: true
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: 11-source multidata cache (mae_multidata_cache)
    pretrain_objective: MAE (var-len, alt-attn)
  mae_5src:
    name: Ours (MAE, 5-source)
    short: MAE-5src
    group: ours
    order: 1
    run: vit1d_ssl_mae_varlen_altattn_realdata_ocdetect_eatingspeed_motionx_sonic
    ckpt: best
    alt_attention: true
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: realdata, ocdetect, eatingspeed, motionx, sonic (5-source; Nymeria/TotalCapture
      genuinely held out)
    pretrain_objective: MAE (var-len, alt-attn)
  mae_noaltattn:
    name: Ours (MAE, no alt-attn)
    short: MAE-noAA
    group: ablation
    order: 10
    run: vit1d_ssl_mae_varlen_noaltattn_multidata
    ckpt: best
    alt_attention: false
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: 11-source multidata cache
    pretrain_objective: MAE (var-len, plain ViT1D encoder)
  mae_acconly:
    name: Ours (MAE, acc-only)
    short: MAE-acc
    group: ablation
    order: 11
    run: vit1d_ssl_mae_varlen_acconly_multidata
    ckpt: best
    alt_attention: true
    channels: 3
    shared_kernel: true
    params_m: 21
    pretrain_data: 11-source multidata cache, accelerometer channels only
    pretrain_objective: MAE (var-len, alt-attn, acc-only)
  focal:
    name: FOCAL
    short: FOCAL
    group: ssl_baseline
    order: 20
    run: vit1d_ssl_focal_multidata
    ckpt: best
    alt_attention: false
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: 11-source multidata cache
    pretrain_objective: FOCAL (Liu et al. 2023) on shared ViT1D backbone
  simmtm:
    name: SimMTM
    short: SimMTM
    group: ssl_baseline
    order: 21
    run: vit1d_ssl_simmtm_multidata
    ckpt: best
    alt_attention: false
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: 11-source multidata cache
    pretrain_objective: SimMTM (Dong et al. 2023) on shared ViT1D backbone
  relcon:
    name: RelCon
    short: RelCon
    group: ssl_baseline
    order: 22
    run: vit1d_ssl_relcon_multidata
    ckpt: best
    alt_attention: false
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: 11-source multidata cache
    pretrain_objective: RelCon (Xu et al. 2025) on shared ViT1D backbone
  scratch:
    name: Scratch (no pretraining)
    short: Scratch
    group: reference
    order: 30
    run: null
    ckpt: null
    alt_attention: true
    channels: 6
    shared_kernel: acc_gyro
    params_m: 21
    pretrain_data: none
    pretrain_objective: none (random init, same alt-attn architecture as mae_11src)
