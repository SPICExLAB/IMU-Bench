      scratch:  {config: configs/vit1d_pd_supervised_pads_altattn_scratch.yaml, objective_type: supervised}
    recipe:
      preprocess.normalize.acc_units: m/s2   # CoreMotion userAcceleration: gravity removed, so |mean acc| is small but the unit IS m/s^2
