  pd_pads:
    name: Parkinson's disease
    subtitle: "PADS smartwatch IMU \u2192 {Healthy, PD, Differential diagnosis} per\
      \ subject"
    family: classification
    order: 6
    dataset:
      name: "PADS (PhysioNet 1.0.0), 469 patients, 11 tasks \xD7 2 wrists"
      parquet: /projects/b53017/vbc1591/pads_dataset.parquet
      split_rule: subject-disjoint 80/20 (375 / 94 subjects), splits.group_key=subject_id,
        seed 0
      test: null
    input:
      channels: 6
      hz: 50
      window_seconds: 2.56
      T: 128
      frame: FLU
      gravity: NOT included (Apple CoreMotion userAcceleration)
    output:
      shape: '[3]'
      desc: class logits per 2.56 s window; subject prediction = argmax of mean softmax
        over all of the subject's windows
      head: LinearHead(384, 3)
    selection:
      split: val
      monitor: bal_acc
      mode: max
      note: window-level val balanced accuracy
    eval_split: val
    metrics:
      # History. Until 2026-09-22 this was subject_macro_f1. It was switched to window_macro_f1
      # because the subject metric was quantised -- 116 scored cells took only 72 distinct values and
      # 0.2544 alone was shared by 18 of them. That quantisation was an artefact of training this head
      # without class weighting (see recipe_by_protocol below): with weighting the 45 re-scored cells
      # take 45 distinct values, so the reason for the switch no longer holds and the clinically
      # meaningful unit is back as the primary (user decision 2026-09-24).
      # What it costs, stated so it is not rediscovered as a surprise: the subject metric still does
      # not order the encoders. The never-trained control reaches 51.7 on it, above five of the nine
      # pretrained encoders, where on the window metric it sits at 38.4 against 44.1 for the MAE.
      # window_macro_f1 is still scored and reported beside it.
      primary: subject_macro_f1
      subject_macro_f1:
        higher_is_better: true
        fmt: '{:.3f}'
        label: subject macro-F1
        desc: "mean-prob aggregation over ~180 windows/subject (scripts/eval_pads_subject_level.py),\
          \ macro-F1 over HC/PD/DD; a class never predicted contributes F1=0. Chance\
          \ \u2248 0.25-0.33"
      subject_bal_acc:
        higher_is_better: true
        fmt: '{:.1%}'
        label: subject bal-acc
        desc: mean per-class subject recall; can reward degenerate classifiers (see
          caveats)
      n_classes_predicted:
        higher_is_better: true
        fmt: '{:.0f}'
        label: '#classes predicted (of 3)'
        desc: 'sanity flag: number of distinct classes the subject-level classifier
          ever predicts'
      window_bal_acc:
        higher_is_better: true
        fmt: '{:.1%}'
        label: window bal-acc
      window_macro_f1:
        higher_is_better: true
        fmt: '{:.3f}'
        label: window macro-F1
      window_acc:
        higher_is_better: true
        fmt: '{:.1%}'
        label: window acc
    scorer: bench.score.pd
    templates:
      probe:
        config: configs/vit1d_pd_probe_pads_mae_multidata_flu.yaml
        objective_type: utd_mhad_probe
      finetune:
        config: configs/vit1d_pd_finetune_pads_mae_multidata_flu.yaml
        objective_type: utd_mhad_finetune
      scratch:
        config: configs/vit1d_pd_supervised_pads_altattn_scratch.yaml
        objective_type: supervised
    recipe:
      preprocess.normalize.acc_units: m/s2
      trainer.early_stopping:
        enabled: true
        monitor: bal_acc
        mode: max
        patience: 20
      logging.save_step_checkpoints: false
    recipe_by_protocol:
      # PADS is 17 % HC / 58 % PD / 24 % DD (train class_counts 11700/39240/16560). Under
      # unweighted CE the head's posteriors carry that prior, and the subject metric averages
      # ~180 windows per subject, which removes the per-window noise and leaves the prior: on
      # 2026-09-23, 73 of 118 scored cells never predicted all three classes at subject level and
      # 15 predicted PD for all 94 subjects (subject macro-F1 exactly 0.2544). The window
      # classifier is not collapsed in those cells -- mae_4src_physnp finetune reads 0.412 window
      # bal-acc while predicting PD for every subject -- so the fault is prior miscalibration,
      # which is what the weighted loss removes. Every other classification task in the benchmark
      # already trains with it. Enabled 2026-09-24; cells scored before that date are NOT
      # comparable with cells scored after.
      probe:
        objective.utd_mhad_probe.class_weighted_ce: true
      finetune:
        objective.utd_mhad_finetune.class_weighted_ce: true
      scratch:
        objective.supervised.class_weighted_ce: true
    slurm:
      time: 03:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    legacy_runs: {}
    legacy_runs_valloss:
      mae_11src/probe: vit1d_pd_probe_pads_mae
      mae_11src/finetune: vit1d_pd_finetune_pads_mae
      mae_5src/probe: vit1d_pd_probe_pads_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      mae_5src/finetune: vit1d_pd_finetune_pads_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      focal/probe: vit1d_pd_probe_pads_focal
      focal/finetune: vit1d_pd_finetune_pads_focal
      simmtm/probe: vit1d_pd_probe_pads_simmtm
      simmtm/finetune: vit1d_pd_finetune_pads_simmtm
      relcon/probe: vit1d_pd_probe_pads_relcon
      relcon/finetune: vit1d_pd_finetune_pads_relcon
      scratch/scratch: vit1d_pd_supervised_pads_scratch
    external: {}
