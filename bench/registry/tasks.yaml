  odometry_nymeria_local_p3c:
    name: Odometry (participant third C)
    subtitle: Nymeria real right-wrist IMU → pelvis velocity in the wrist (FLU) frame
    family: odometry
    order: 3.5
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria pelvis trajectory)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist_p3c
      val: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test: null
      split_rule: train = participant third C of the Nymeria train sessions (bench/registry/splits/nymeria_participant_thirds.json;
        78 participants, participant-disjoint from the other two thirds); eval dir unchanged
    input:
      channels: 6
      hz: 50
      window_seconds: 2.56
      T: 128
      frame: FLU
      gravity: included
    output:
      shape: '[P_t=8, K=4, 3]'
      desc: 3-D pelvis velocity (m/s) expressed in the wrist FLU frame at each sub-patch midpoint (imu_lm/data/nymeria_real_wrist_odom_loader_FLU.py),
        4 sub-patches per 0.32 s patch (0.08 s resolution)
      head: ViT1DOdomDecoder (1 layer, hidden 192; 12 layers for the frozen probe)
    selection:
      split: val
      monitor: val_loss
      mode: min
    eval_split: val
    metrics:
      primary: ate_m
      ate_m:
        higher_is_better: false
        fmt: '{:.4f}'
        label: ATE (m)
        desc: mean absolute trajectory error over all val windows; predicted FLU velocities are rotated to the world frame with
          the ground-truth start orientation propagated by raw-gyro integration, then summed (bench/score/odometry_local.py,
          = scripts/eval_odom_nymeria_altattn.py::reconstruct_and_score)
      drift_pct:
        higher_is_better: false
        fmt: '{:.2f}'
        label: drift (%)
        desc: final-position error / path length over windows with path > 0.1 m
      vel_mse:
        higher_is_better: false
        fmt: '{:.5f}'
        label: vel MSE
    scorer: bench.score.odometry_local
    templates:
      probe:
        config: configs/vit1d_odom_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: odom_finetune_nymeria_real_wrist_flu
        extra:
          freeze_encoder: true
      finetune:
        config: configs/vit1d_odom_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: odom_finetune_nymeria_real_wrist_flu
      scratch:
        config: configs/vit1d_odom_supervised_nymeria_altattn_scratch.yaml
        objective_type: odom_nymeria_real_wrist_flu
    recipe:
      trainer.early_stopping:
        enabled: true
        monitor: val_loss
        patience: 20
        min_delta: 0.0001
      logging.save_step_checkpoints: false
    slurm:
      time: 08:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    _note: 'replaces odometry_nymeria_worldframe on 2026-09-18 (user decision): same data, windows, decoders, recipe and budgets;
      only the label frame (wrist FLU instead of per-window heading-canonical world frame) and the matching ATE reconstruction
      change. World-frame results are void.'
    _probe_decoder_2026_09_19: 'frozen-probe decoder reverted on 2026-09-19 (user decision) to the task template''s original
      decoder (arm: 2 layers, full body: 1 layer, odometry: 1 layer; width 192): with the deep decoder used from 2026-08-27
      a never-trained frozen encoder matched the pretrained ones; those results live in odometry_nymeria_local_deepdec (appendix)'
    enabled: false
    note_p3: 'Nymeria participant-split transfer control (2026-09-24): arm pose, full-body pose and odometry each train on a
      disjoint third, so a source encoder never saw the target task''s training windows or participants.'
    recipe_by_protocol:
      probe:
        objective.odom_finetune_nymeria_real_wrist_flu.train_pkl_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist_p3c
      finetune:
