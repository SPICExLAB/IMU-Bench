  # ─────────────────────────────────────────────────────────────────────
  # FRAME-MATCH ABLATION: rotated-frame eval variants (2026-08-20).
  # Same dataset, same split, same recipe as the base card -- the ONLY
  # difference is `frame_perturb`, one fixed random SO(3) rotation of the
  # raw window applied to train AND val alike (imu_lm/data/augmentations/
  # transform.py::apply_frame_perturb, called from preprocess_window). They
  # measure what a frozen encoder loses when the sensor is mounted in a
  # frame it never saw. `in_grid: false` keeps them out of --fill-missing;
  # `hidden: true` keeps them out of the leaderboard's main tables.
  arm_pose_nymeria_rot7:
    name: "Arm pose \xB7 rotated frame"
    subtitle: "Nymeria real right-wrist IMU \u2192 5-joint right-arm chain rotations \u2014 identical task,\
      \ re-expressed in ONE fixed random SO(3) frame (frame_perturb seed 7), applied to every split"
    family: pose
    order: 900
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria mocap)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
      val: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test: null
      split_rule: fixed pre-partitioned session directories (session-disjoint)
    input:
      channels: 6
      hz: 50
      window_seconds: 10.24
      T: 512
      frame: FLU
      gravity: included
    output:
      shape: '[P_t=32, J=5, 6]'
      desc: 6D-continuous local rotations of SMPL joints [14,17,19,21,23] (collar, shoulder, elbow, wrist,
        hand), one per 0.32 s patch
      head: ViT1DPoseDecoder (2 layers, hidden 192)
    selection:
      split: val
      monitor: val_loss
      mode: min
    eval_split: val
    metrics:
      primary: pos_err_cm
      pos_err_cm:
        higher_is_better: false
        fmt: '{:.2f}'
        label: pos err (cm)
        desc: FK joint-position error at the 5 arm joints with GT ancestors (scripts/eval_arm_pose_position_error.py)
      ang_err_deg:
        higher_is_better: false
        fmt: '{:.2f}'
        label: "ang err (\xB0)"
      val_pose_mse:
        higher_is_better: false
        fmt: '{:.5f}'
        label: val 6D-MSE
    scorer: bench.score.arm_pose
    templates:
      probe:
        config: configs/vit1d_arm_pose_probe_nymeria_mae_multidata_flu.yaml
        objective_type: pose_probe
      finetune:
        config: configs/vit1d_arm_pose_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: pose
      scratch:
        config: configs/vit1d_arm_pose_supervised_nymeria_altattn_scratch.yaml
        objective_type: pose
    recipe:
      trainer.early_stopping:
        enabled: true
        monitor: val_loss
        patience: 20
      logging.save_step_checkpoints: false
      frame_perturb:
        enabled: true
        mode: fixed
        rotation_set: so3
        seed: 7
    slurm:
      time: 06:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    in_grid: false
    hidden: true
    frame_variant:
      of: arm_pose_nymeria
      frame_perturb:
        enabled: true
        mode: fixed
        rotation_set: so3
        seed: 7
