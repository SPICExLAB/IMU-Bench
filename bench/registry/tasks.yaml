# IMU-Bench task registry (v1).
#
# One card per benchmark task. Everything the leaderboard, the config
# generator, the launcher and the scorer need to know about a task lives here.
#
# UNIFIED INPUT (all tasks): a single wrist IMU stream, x in R^{C x T},
#   C = 6 channels [acc_F, acc_L, acc_U, gyro_F, gyro_L, gyro_U] in the FLU
#   (forward-left-up) sensor frame, acc in m/s^2 WITH gravity, gyro in rad/s,
#   50 Hz (microgesture: native 100 Hz, see card), z-scored per window.
#   The acc-only ablation encoder receives x[:3].
#   T = 512 (10.24 s) for pose / language; 128 (2.56 s) for odometry and PD;
#   128 (1 s @ 100 Hz zero-padded) for microgesture.
#
# UNIFIED OUTPUT: declared per card (`output`) as the tensor the task head
#   emits per window; the scorer maps it to the primary metric.
#
# CONTROL VARIABLES (identical for every encoder within a task):
#   the training template + `recipe` block (LR/steps/patience/monitor), the
#   split, the seed, the checkpoint-selection rule and the scorer.
#
# Metric direction: `higher_is_better` per metric. `primary` is the single
#   number ranked on the leaderboard; everything else is shown in the
#   per-task detail table.
#
# `legacy_runs`: existing runs/<name> that were trained with a config
#   equivalent to what make_config.py would generate (same template, same
#   recipe) -> harvest.py imports them so the leaderboard starts populated;
#   the cell keeps provenance "harvest:<run>" until re-run through the harness.

version: 1

tasks:

  # ───────────────────────────────────────────────────────────────────────
  arm_pose_nymeria:
    name: "Arm pose"
    subtitle: "Nymeria real right-wrist IMU → 5-joint right-arm chain rotations"
    family: pose
    order: 1
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria mocap)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist   # 867 sessions
      val:   /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist  # 101 sessions
      test:  null                       # v1: no held-out test split (val is reported)
      split_rule: "fixed pre-partitioned session directories (session-disjoint)"
    input:
      channels: 6
      hz: 50
      window_seconds: 10.24
      T: 512
      frame: FLU
      gravity: included
    output:
      shape: "[P_t=32, J=5, 6]"
      desc: "6D-continuous local rotations of SMPL joints [14,17,19,21,23] (collar, shoulder, elbow, wrist, hand), one per 0.32 s patch"
      head: ViT1DPoseDecoder (2 layers, hidden 192)
    selection: {split: val, monitor: val_loss, mode: min}
    eval_split: val
    metrics:
      primary: pos_err_cm
      pos_err_cm:  {higher_is_better: false, fmt: "{:.2f}", label: "pos err (cm)", desc: "FK joint-position error at the 5 arm joints with GT ancestors (scripts/eval_arm_pose_position_error.py)"}
      ang_err_deg: {higher_is_better: false, fmt: "{:.2f}", label: "ang err (°)"}
      val_pose_mse: {higher_is_better: false, fmt: "{:.5f}", label: "val 6D-MSE"}
    scorer: bench.score.arm_pose
    templates:
      probe:    {config: configs/vit1d_arm_pose_probe_nymeria_mae_multidata_flu.yaml, objective_type: pose_probe}
      finetune: {config: configs/vit1d_arm_pose_finetune_nymeria_mae_multidata_flu.yaml, objective_type: pose}
      scratch:  {config: configs/vit1d_arm_pose_supervised_nymeria_altattn_scratch.yaml, objective_type: pose}
    recipe:
      trainer.early_stopping: {enabled: true, monitor: val_loss, patience: 20}
      logging.save_step_checkpoints: false
    slurm: {time: "06:00:00", gres: "gpu:1", mem: 64G, cpus: 8}
    legacy_runs:
      mae_11src/probe:      vit1d_arm_pose_probe_nymeria_mae_multidata
      mae_11src/finetune:   vit1d_arm_pose_finetune_nymeria_mae_multidata
      mae_5src/probe:       vit1d_arm_pose_probe_nymeria_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      mae_5src/finetune:    vit1d_arm_pose_finetune_nymeria_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      mae_noaltattn/probe:  vit1d_arm_pose_probe_nymeria_mae_noaltattn_multidata
      mae_acconly/probe:    vit1d_arm_pose_probe_nymeria_mae_acconly_multidata
      focal/probe:          vit1d_arm_pose_probe_nymeria_focal_multidata
      simmtm/probe:         vit1d_arm_pose_probe_nymeria_simmtm_multidata
      relcon/probe:         vit1d_arm_pose_probe_nymeria_relcon_multidata
      scratch/scratch:      vit1d_arm_pose_supervised_nymeria_altattn_scratch
    external:
      mobileposer: {metrics: {pos_err_cm: 9.74, ang_err_deg: 24.28}, source: "Experiments_table.md §1 / baselines/full_body_pose/SimplePoser", notes: "MobilePoser predicts the torso chain too (compounding); our metric holds ancestors at GT."}

  # ───────────────────────────────────────────────────────────────────────
  full_body_pose_nymeria:
    name: "Full-body pose"
    subtitle: "Nymeria real right-wrist IMU → 23-joint SMPL body (root excluded)"
    family: pose
    order: 2
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria mocap)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
      val:   /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test:  null
      split_rule: "fixed pre-partitioned session directories (session-disjoint)"
    input: {channels: 6, hz: 50, window_seconds: 10.24, T: 512, frame: FLU, gravity: included}
    output:
      shape: "[P_t=32, J=23, 6]"
      desc: "6D local rotations for SMPL joints 1..23, one per 0.32 s patch (sub_patches=1)"
      head: ViT1DPoseDecoder
    selection: {split: val, monitor: mpjpe_mm, mode: min}
    eval_split: val
    metrics:
      primary: mpjpe_mm
      mpjpe_mm:  {higher_is_better: false, fmt: "{:.2f}", label: "MPJPE (mm)", desc: "root-relative FK joint position error, joints 1-23 (imu_lm/objectives/pose_1d.py::_compute_val_mpjpe), at the selected checkpoint"}
      val_pose_mse: {higher_is_better: false, fmt: "{:.5f}", label: "val 6D-MSE"}
    scorer: bench.score.full_body_pose
    templates:
      probe:    {config: configs/vit1d_full_body_pose_probe_nymeria_mae_multidata_flu.yaml, objective_type: pose_probe}
      finetune: {config: configs/vit1d_full_body_pose_finetune_nymeria_mae_multidata_flu.yaml, objective_type: pose}
      scratch:  {config: configs/vit1d_full_body_pose_supervised_nymeria_altattn_scratch.yaml, objective_type: pose}
    recipe:
      # legacy probe/scratch configs had early stopping DISABLED (runaway jobs, only
      # best_mpjpe.pt written); the bench recipe selects on val mpjpe with patience.
      trainer.early_stopping: {enabled: true, monitor: mpjpe_mm, mode: min, patience: 20}
      logging.save_step_checkpoints: false
    recipe_by_protocol:
      # Finetune LR = 1e-3 for EVERY encoder (2026-08-17): the template's 1e-4 was
      # untuned; the LR-only sweep (Experiments_table §2a) showed a flat plateau over
      # 5e-4..2e-3 (87.8 mm) vs 92.4 mm at 1e-4 for MAE. One recipe per task, so all
      # encoders get it. Legacy 1e-4 finetune results are archived under
      # bench/results/_archive/full_body_pose_nymeria_finetune_lr1e-4/.
      finetune: {trainer.optim.lr: 0.001}
    checkpoint: best_mpjpe        # min-val-MPJPE checkpoint for legacy AND bench runs (bench best.pt == best_mpjpe.pt)
    slurm: {time: "12:00:00", gres: "gpu:1", mem: 64G, cpus: 8}
    legacy_runs:
      mae_11src/probe:      vit1d_full_body_pose_probe_nymeria_mae_multidata
      mae_11src/finetune:   vit1d_full_body_pose_finetune_nymeria_mae_multidata_lr1e-3   # LR-sweep run, config == template + lr 1e-3
      mae_5src/probe:       vit1d_full_body_pose_probe_nymeria_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      mae_noaltattn/probe:  vit1d_full_body_pose_probe_nymeria_mae_noaltattn_multidata
      mae_acconly/probe:    vit1d_full_body_pose_probe_nymeria_mae_acconly_multidata
      focal/probe:          vit1d_full_body_pose_probe_nymeria_focal_multidata
      simmtm/probe:         vit1d_full_body_pose_probe_nymeria_simmtm_multidata
      relcon/probe:         vit1d_full_body_pose_probe_nymeria_relcon_multidata
      scratch/scratch:      vit1d_full_body_pose_supervised_nymeria_altattn_scratch
    external:
      mobileposer: {metrics: {mpjpe_mm: 91.88}, source: "Experiments_table.md §2 / baselines/full_body_pose/SimplePoser"}

  # ───────────────────────────────────────────────────────────────────────
  odometry_nymeria_worldframe:
    name: "Odometry"
    subtitle: "Nymeria real right-wrist IMU → pelvis velocity in a per-window canonical world frame"
    family: odometry
    order: 3
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria pelvis trajectory)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
      val:   /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test:  null
      split_rule: "fixed pre-partitioned session directories (session-disjoint)"
    input: {channels: 6, hz: 50, window_seconds: 2.56, T: 128, frame: FLU, gravity: included}
    output:
      shape: "[P_t=8, K=4, 3]"
      desc: "3-D pelvis velocity (m/s) in the window's canonical world frame (heading of net displacement → +X), 4 sub-patches per 0.32 s patch (0.08 s resolution)"
      head: ViT1DOdomDecoder (1 layer, hidden 192)
    selection: {split: val, monitor: val_loss, mode: min}
    eval_split: val
    metrics:
      primary: ate_m
      ate_m:     {higher_is_better: false, fmt: "{:.4f}", label: "ATE (m)", desc: "mean absolute trajectory error of the cumulative-sum reconstruction over all val windows (scripts/eval_odom_nymeria_worldframe.py::reconstruct_and_score)"}
      drift_pct: {higher_is_better: false, fmt: "{:.2f}", label: "drift (%)", desc: "final-position error / path length over windows with path > 0.1 m"}
      vel_mse:   {higher_is_better: false, fmt: "{:.5f}", label: "vel MSE"}
    scorer: bench.score.odometry
    templates:
      # probe = the finetune objective with freeze_encoder: true (added to run.py) so
      # probe/finetune/scratch share ONE loader, window (2.56 s) and decoder.
      probe:    {config: configs/vit1d_odom_worldframe_finetune_nymeria_mae_multidata_flu.yaml, objective_type: odom_finetune_nymeria_real_wrist_worldframe_flu, extra: {freeze_encoder: true}}
      finetune: {config: configs/vit1d_odom_worldframe_finetune_nymeria_mae_multidata_flu.yaml, objective_type: odom_finetune_nymeria_real_wrist_worldframe_flu}
      scratch:  {config: configs/vit1d_odom_worldframe_supervised_nymeria_altattn_scratch.yaml, objective_type: odom_nymeria_real_wrist_worldframe_flu}
    recipe:
      trainer.early_stopping: {enabled: true, monitor: val_loss, patience: 20, min_delta: 0.0001}
      logging.save_step_checkpoints: false
    recipe_by_protocol:
      probe: {trainer.optim.lr: 0.0003}
    slurm: {time: "08:00:00", gres: "gpu:1", mem: 64G, cpus: 8}
    legacy_runs:
      mae_11src/finetune:   vit1d_odom_worldframe_finetune_nymeria_mae_multidata
      mae_5src/finetune:    vit1d_odom_worldframe_finetune_nymeria_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      scratch/scratch:      vit1d_odom_worldframe_supervised_nymeria_altattn_scratch
    external:
      # scored on THIS protocol by baselines/full_body_pose/SimplePoser/eval_nymeria_worldframe_odom.py
      # (writes the result JSON itself; `scored: true` tells --harvest-external not to overwrite it).
      # Its native "root translation error over 1 s" (15.0 cm) is NOT an ATE and is no longer shown.
      mobileposer: {scored: true, source: "baselines/full_body_pose/SimplePoser/eval_nymeria_worldframe_odom.py"}
      tlio:        {metrics: {ate_m: 0.1510, drift_pct: 38.79, vel_mse: 0.02419}, source: "Experiments_table.md §4b / baselines/odometry/TLIO"}
      airio:       {metrics: {ate_m: 0.1444, drift_pct: 38.56, vel_mse: 0.02461}, source: "Experiments_table.md §4b / baselines/odometry/Air-IO"}

  # ───────────────────────────────────────────────────────────────────────
  microgesture_openwatch:
    name: "Microgesture"
    subtitle: "OpenWatch wrist IMU → 5 gestures + background (paper protocol, real recordings)"
    family: classification
    order: 4
    dataset:
      name: OpenWatch (Bonazzi et al.), open_watch_without_augmentations
      root: /projects/b53017/vbc1591/openwatch_raw/open_watch_without_augmentations
      split_rule: "contamination-safe posture-stratified subject split over canonical identities, seed 42, 80/10/10 (33/5/5 subjects; val 102 clips / test 87 clips)"
      test: "yes — paper-comparable"
    input:
      channels: 6
      hz: 100
      window_seconds: 1.0
      T: 128
      frame: FLU
      gravity: included
      note: "1 s (100-sample) windows at stride 20 from a centred 2.0 s sub-interval (6 windows/clip), zero-padded to 128 samples after preprocessing"
    output:
      shape: "[6]"
      desc: "class logits per 1 s window; clip label = first run of k=3 identical window predictions, else majority (imu_lm/utils/clip_voting.py)"
      head: LinearHead(384, 6)
    selection: {split: val, monitor: macro_f1, mode: max, note: "window-level val macro-F1 (paper §3.3.3), inverse-frequency class-weighted CE"}
    eval_split: test
    metrics:
      primary: clip_macro_f1
      clip_macro_f1:   {higher_is_better: true, fmt: "{:.3f}", label: "clip F1 (test)"}
      clip_acc:        {higher_is_better: true, fmt: "{:.3f}", label: "clip acc (test)"}
      window_macro_f1: {higher_is_better: true, fmt: "{:.3f}", label: "win F1 (test)"}
      window_acc:      {higher_is_better: true, fmt: "{:.3f}", label: "win acc (test)"}
      val_clip_macro_f1: {higher_is_better: true, fmt: "{:.3f}", label: "clip F1 (val)"}
      val_window_macro_f1: {higher_is_better: true, fmt: "{:.3f}", label: "win F1 (val)"}
    recipe_by_protocol:
      finetune:
        trainer.optim.lr: 1.0e-5   # 2026-08-27: 1e-4 overfits OpenWatch's ~200 train clips (val loss
                                   # 1.05 -> 2.5 by step 2.4k while val F1 only oscillates), and selection
                                   # then picks a noise peak that does not transfer (val 0.694 -> test 0.582).
                                   # At 1e-5 the same encoder scores test 0.638 with val 0.722, and a second
                                   # low-LR variant reproduces it (0.635). Applies to EVERY encoder.
    scorer: bench.score.microgesture
    templates:
      probe:    {config: configs/vit1d_gesture_probe_openwatch_6class_mae_multidata_flu_windowed_stratified.yaml, objective_type: openwatch_gesture_probe}
      finetune: {config: configs/vit1d_gesture_finetune_openwatch_6class_mae_multidata_flu_windowed_stratified.yaml, objective_type: openwatch_gesture_finetune}
      scratch:  {config: configs/vit1d_gesture_supervised_openwatch_6class_altattn_scratch_windowed_stratified.yaml, objective_type: openwatch_gesture_supervised}
    recipe:
      trainer.early_stopping: {enabled: true, monitor: macro_f1, mode: max, patience: 20}
      logging.save_step_checkpoints: false
      # OpenWatch CSVs are raw integer sensor counts (Huawei Watch GT 4, 100 Hz): |acc| at rest = 4,096
      # LSB/g; gyro 14.3 LSB/dps (+-2000 dps, fitted 13.4 from gravity-direction rotation). Convert to
      # m/s^2 and rad/s so physical / raw encoders see real units (z-score encoders: no-op). 2026-08-23
      data.acc_scale: 0.0023942
      data.gyro_scale: 0.0012217
    slurm: {time: "03:00:00", gres: "gpu:1", mem: 64G, cpus: 8}
    legacy_runs:
      mae_11src/probe:      vit1d_gesture_probe_openwatch_6class_mae_windowed_strat
      mae_11src/finetune:   vit1d_gesture_finetune_openwatch_6class_mae_windowed_strat
      mae_noaltattn/probe:  vit1d_gesture_probe_openwatch_6class_mae_noaltattn_windowed_strat
      mae_acconly/probe:    vit1d_gesture_probe_openwatch_6class_mae_acconly_windowed_strat
      focal/probe:          vit1d_gesture_probe_openwatch_6class_focal_windowed_strat
      simmtm/probe:         vit1d_gesture_probe_openwatch_6class_simmtm_windowed_strat
      relcon/probe:         vit1d_gesture_probe_openwatch_6class_relcon_windowed_strat
      scratch/scratch:      vit1d_gesture_supervised_openwatch_6class_altattn_scratch_windowed_strat
    external:
      mixtoken: {metrics: {clip_macro_f1: 0.500, clip_acc: 0.621, window_macro_f1: 0.490, window_acc: 0.592}, source: "results_openwatch_mixtoken_noaug.json (test)", eval_split: test}
      normwear: {metrics: {clip_macro_f1: 0.453, clip_acc: 0.517, window_macro_f1: 0.425, window_acc: 0.504}, source: "results_openwatch_normwear_protocol_noaug.json (test)", eval_split: test}

  # ───────────────────────────────────────────────────────────────────────
  language_humanml3d:
    name: "Language alignment"
    subtitle: "HumanML3D synthetic wrist IMU (UniMTS_data) ↔ text retrieval"
    family: retrieval
    order: 5
    dataset:
      name: HumanML3D / UniMTS_data sim (right-wrist channel), aug_texts captions
      root: /projects/b53017/vbc1591/HumanML3D
      split_rule: "HumanML3D official train/val/test lists (val 1,197 clips; test 3,701 clips)"
      test: "yes"
    input: {channels: 6, hz: 50, window_seconds: 10.24, T: 512, frame: FLU, gravity: included, note: "clips wrap-padded to 512, deterministic first-crop; SO(3) rotation aug at train time"}
    output:
      shape: "[512]"
      desc: "L2-normalised IMU embedding in CLIP ViT-B/32 text space (ContrastiveCLIPHead); text tower trainable, i2t InfoNCE, τ=0.1 fixed"
      head: ContrastiveCLIPHead(384→512) + CLIP text tower
    selection: {split: none, monitor: fixed_budget, mode: latest, note: "fixed 8k-step budget, final checkpoint (latest.pt); §13e: val-loss best.pt under-selects for retrieval, latest ≥ best on every arm"}
    eval_split: test
    metrics:
      primary: r1_g100
      r1_g100:      {higher_is_better: true, fmt: "{:.1f}", label: "R@1 G=100 (mean i2t/t2i)", desc: "mean of IMU→Text and Text→IMU Recall@1 over 200 random 100-item galleries, first-caption protocol"}
      r1_i2t_g100:  {higher_is_better: true, fmt: "{:.1f}", label: "i2t R@1"}
      r1_t2i_g100:  {higher_is_better: true, fmt: "{:.1f}", label: "t2i R@1"}
      mrr_i2t_g100: {higher_is_better: true, fmt: "{:.1f}", label: "i2t MRR"}
      mrr_t2i_g100: {higher_is_better: true, fmt: "{:.1f}", label: "t2i MRR"}
      r1_i2t_full:  {higher_is_better: true, fmt: "{:.1f}", label: "i2t R@1 full"}
      r1_t2i_full:  {higher_is_better: true, fmt: "{:.1f}", label: "t2i R@1 full"}
      mrr_i2t_full: {higher_is_better: true, fmt: "{:.1f}", label: "i2t MRR full"}
      mrr_t2i_full: {higher_is_better: true, fmt: "{:.1f}", label: "t2i MRR full"}
      val_r1_g100:  {higher_is_better: true, fmt: "{:.1f}", label: "R@1 G=100 (val)"}
    scorer: bench.score.language
    templates:
      # §13e tuned recipe (lr 1e-4, τ 0.1 fixed) is the single template; protocol
      # toggles freeze_imu_encoder / pretrained_run.
      probe:    {config: configs/retrieval_tune/lr1e-4_tau0.1fixed.yaml, objective_type: imu_text_clip_flu, extra: {freeze_imu_encoder: true}}
      finetune: {config: configs/retrieval_tune/lr1e-4_tau0.1fixed.yaml, objective_type: imu_text_clip_flu, extra: {freeze_imu_encoder: false}}
      scratch:  {config: configs/retrieval_tune/lr1e-4_tau0.1fixed.yaml, objective_type: imu_text_clip_flu, extra: {freeze_imu_encoder: false}}
    recipe:
      trainer.max_steps: 8000
      trainer.early_stopping: {enabled: true, monitor: val_loss, patience: 1000}   # never fires; best.pt kept for reference, latest.pt is scored
      logging.save_step_checkpoints: false
    checkpoint: latest
    slurm: {time: "03:00:00", gres: "gpu:1", mem: 64G, cpus: 8}
    legacy_runs:
      mae_11src/finetune:   rtune_lr1e-4_tau0.1fixed
    external:
      unimts:         {metrics: {r1_g100: 17.6, r1_i2t_g100: 33.6, r1_t2i_g100: 1.6, mrr_i2t_g100: 49.3, mrr_t2i_g100: 6.4}, source: "analysis/retrieval_eval/humanml3d__unimts_official_wrist.json (VAL split; contaminated: pretrained on HumanML3D)", eval_split: val, status: invalid}
      unimts_scratch: {metrics: {r1_g100: 13.05, r1_i2t_g100: 24.4, r1_t2i_g100: 1.7, mrr_i2t_g100: 39.1, mrr_t2i_g100: 6.7}, source: "analysis/retrieval_eval/humanml3d__unimts_scratch_jointmask_wrist.json (VAL split)", eval_split: val}

  # ───────────────────────────────────────────────────────────────────────
  pd_pads:
    name: "Parkinson's disease"
    subtitle: "PADS smartwatch IMU → {Healthy, PD, Differential diagnosis} per subject"
    family: classification
    order: 6
    dataset:
      name: PADS (PhysioNet 1.0.0), 469 patients, 11 tasks × 2 wrists
      parquet: /projects/b53017/vbc1591/pads_dataset.parquet
      split_rule: "subject-disjoint 80/20 (375 / 94 subjects), splits.group_key=subject_id, seed 0"
      test: null
    input: {channels: 6, hz: 50, window_seconds: 2.56, T: 128, frame: FLU, gravity: "NOT included (Apple CoreMotion userAcceleration)"}
    output:
      shape: "[3]"
      desc: "class logits per 2.56 s window; subject prediction = argmax of mean softmax over all of the subject's windows"
      head: LinearHead(384, 3)
    selection: {split: val, monitor: bal_acc, mode: max, note: "window-level val balanced accuracy"}
    eval_split: val
    metrics:
      # primary switched bal-acc -> macro-F1 on 2026-08-18: with 14 HC / 58 PD / 22 DD val subjects a
      # classifier that never predicts the majority class scores bal-acc 0.54 while getting 31 % of
      # subjects right (ART-large probe); macro-F1 charges a zero for any class never predicted.
      primary: subject_macro_f1
      subject_macro_f1: {higher_is_better: true, fmt: "{:.3f}", label: "subject macro-F1", desc: "mean-prob aggregation over ~180 windows/subject (scripts/eval_pads_subject_level.py), macro-F1 over HC/PD/DD; a class never predicted contributes F1=0. Chance ≈ 0.25-0.33"}
      subject_bal_acc:  {higher_is_better: true, fmt: "{:.1%}", label: "subject bal-acc", desc: "mean per-class subject recall; can reward degenerate classifiers (see caveats)"}
      n_classes_predicted: {higher_is_better: true, fmt: "{:.0f}", label: "#classes predicted (of 3)", desc: "sanity flag: number of distinct classes the subject-level classifier ever predicts"}
      window_bal_acc:   {higher_is_better: true, fmt: "{:.1%}", label: "window bal-acc"}
