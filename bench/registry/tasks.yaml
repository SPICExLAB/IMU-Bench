version: 1
tasks:
  arm_pose_nymeria:
    name: Arm pose
    subtitle: "Nymeria real right-wrist IMU \u2192 5-joint right-arm chain rotations"
    family: pose
    order: 1
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria mocap)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
      val: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test: null
      split_rule: fixed pre-partitioned session directories (session-disjoint)
    input:
      channels: 6
      hz: 50
      window_seconds: 10.24
      T: 512
      frame: FLU
      gravity: included
    output:
      shape: '[P_t=32, J=5, 6]'
      desc: 6D-continuous local rotations of SMPL joints [14,17,19,21,23] (collar,
        shoulder, elbow, wrist, hand), one per 0.32 s patch
      head: ViT1DPoseDecoder (2 layers, hidden 192)
    selection:
      split: val
      monitor: val_loss
      mode: min
    eval_split: val
    metrics:
      primary: pos_err_cm
      pos_err_cm:
        higher_is_better: false
        fmt: '{:.2f}'
        label: pos err (cm)
        desc: FK joint-position error at the 5 arm joints with GT ancestors (scripts/eval_arm_pose_position_error.py)
      ang_err_deg:
        higher_is_better: false
        fmt: '{:.2f}'
        label: "ang err (\xB0)"
      val_pose_mse:
        higher_is_better: false
        fmt: '{:.5f}'
        label: val 6D-MSE
    scorer: bench.score.arm_pose
    templates:
      probe:
        config: configs/vit1d_arm_pose_probe_nymeria_mae_multidata_flu.yaml
        objective_type: pose_probe
      finetune:
        config: configs/vit1d_arm_pose_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: pose
      scratch:
        config: configs/vit1d_arm_pose_supervised_nymeria_altattn_scratch.yaml
        objective_type: pose
    recipe:
      trainer.early_stopping:
        enabled: true
        monitor: val_loss
        patience: 20
      logging.save_step_checkpoints: false
    slurm:
      time: 06:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    legacy_runs:
      mae_11src/probe: vit1d_arm_pose_probe_nymeria_mae_multidata
      mae_11src/finetune: vit1d_arm_pose_finetune_nymeria_mae_multidata
      mae_5src/probe: vit1d_arm_pose_probe_nymeria_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      mae_5src/finetune: vit1d_arm_pose_finetune_nymeria_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      mae_noaltattn/probe: vit1d_arm_pose_probe_nymeria_mae_noaltattn_multidata
      mae_acconly/probe: vit1d_arm_pose_probe_nymeria_mae_acconly_multidata
      focal/probe: vit1d_arm_pose_probe_nymeria_focal_multidata
      simmtm/probe: vit1d_arm_pose_probe_nymeria_simmtm_multidata
      relcon/probe: vit1d_arm_pose_probe_nymeria_relcon_multidata
      scratch/scratch: vit1d_arm_pose_supervised_nymeria_altattn_scratch
    external:
      mobileposer:
        metrics:
          pos_err_cm: 9.74
          ang_err_deg: 24.28
        source: "Experiments_table.md \xA71 / baselines/full_body_pose/SimplePoser"
        notes: MobilePoser predicts the torso chain too (compounding); our metric
          holds ancestors at GT.
    _decoder_note: 'probe decoder promoted to arm d12w on 2026-08-27: chosen by the
      task''s primary metric over three ~12-layer variants, then applied to every
      encoder'
    _probe_decoder_2026_09_19: 'frozen-probe decoder reverted on 2026-09-19 (user decision) to the task template''s original decoder (arm: 2 layers, full body: 1 layer, odometry: 1 layer; width 192): with the deep decoder used from 2026-08-27 a never-trained frozen encoder matched the pretrained ones; those results live in arm_pose_nymeria_deepdec (appendix)'
  full_body_pose_nymeria:
    name: Full-body pose
    subtitle: "Nymeria real right-wrist IMU \u2192 23-joint SMPL body (root excluded)"
    family: pose
    order: 2
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria mocap)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
      val: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test: null
      split_rule: fixed pre-partitioned session directories (session-disjoint)
    input:
      channels: 6
      hz: 50
      window_seconds: 10.24
      T: 512
      frame: FLU
      gravity: included
    output:
      shape: '[P_t=32, J=23, 6]'
      desc: 6D local rotations for SMPL joints 1..23, one per 0.32 s patch (sub_patches=1)
      head: ViT1DPoseDecoder
    selection:
      split: val
      monitor: mpjpe_mm
      mode: min
    eval_split: val
    metrics:
      primary: mpjpe_mm
      mpjpe_mm:
        higher_is_better: false
        fmt: '{:.2f}'
        label: MPJPE (mm)
        desc: root-relative FK joint position error, joints 1-23 (imu_lm/objectives/pose_1d.py::_compute_val_mpjpe),
          at the selected checkpoint
      val_pose_mse:
        higher_is_better: false
        fmt: '{:.5f}'
        label: val 6D-MSE
    scorer: bench.score.full_body_pose
    templates:
      probe:
        config: configs/vit1d_full_body_pose_probe_nymeria_mae_multidata_flu.yaml
        objective_type: pose_probe
      finetune:
        config: configs/vit1d_full_body_pose_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: pose
      scratch:
        config: configs/vit1d_full_body_pose_supervised_nymeria_altattn_scratch.yaml
        objective_type: pose
    recipe:
      trainer.early_stopping:
        enabled: true
        monitor: mpjpe_mm
        mode: min
        patience: 20
      logging.save_step_checkpoints: false
    recipe_by_protocol:
      finetune:
        trainer.optim.lr: 0.001
    checkpoint: best_mpjpe
    slurm:
      time: '12:00:00'
      gres: gpu:1
      mem: '96G'
      cpus: 8
    legacy_runs:
      mae_11src/probe: vit1d_full_body_pose_probe_nymeria_mae_multidata
      mae_11src/finetune: vit1d_full_body_pose_finetune_nymeria_mae_multidata_lr1e-3
      mae_5src/probe: vit1d_full_body_pose_probe_nymeria_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      mae_noaltattn/probe: vit1d_full_body_pose_probe_nymeria_mae_noaltattn_multidata
      mae_acconly/probe: vit1d_full_body_pose_probe_nymeria_mae_acconly_multidata
      focal/probe: vit1d_full_body_pose_probe_nymeria_focal_multidata
      simmtm/probe: vit1d_full_body_pose_probe_nymeria_simmtm_multidata
      relcon/probe: vit1d_full_body_pose_probe_nymeria_relcon_multidata
      scratch/scratch: vit1d_full_body_pose_supervised_nymeria_altattn_scratch
    external:
      mobileposer:
        metrics:
          mpjpe_mm: 91.88
        source: "Experiments_table.md \xA72 / baselines/full_body_pose/SimplePoser"
    _decoder_note: 'probe decoder promoted to arm d12w on 2026-08-27: chosen by the
      task''s primary metric over three ~12-layer variants, then applied to every
      encoder'
    _probe_decoder_2026_09_19: 'frozen-probe decoder reverted on 2026-09-19 (user decision) to the task template''s original decoder (arm: 2 layers, full body: 1 layer, odometry: 1 layer; width 192): with the deep decoder used from 2026-08-27 a never-trained frozen encoder matched the pretrained ones; those results live in full_body_pose_nymeria_deepdec (appendix)'
  odometry_nymeria_worldframe:
    enabled: false   # VOID 2026-09-18 (user decision): replaced by odometry_nymeria_local (wrist-frame velocity); every world-frame result is superseded
    name: Odometry
    subtitle: "Nymeria real right-wrist IMU \u2192 pelvis velocity in a per-window\
      \ canonical world frame"
    family: odometry
    order: 3
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria pelvis trajectory)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
      val: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test: null
      split_rule: fixed pre-partitioned session directories (session-disjoint)
    input:
      channels: 6
      hz: 50
      window_seconds: 2.56
      T: 128
      frame: FLU
      gravity: included
    output:
      shape: '[P_t=8, K=4, 3]'
      desc: "3-D pelvis velocity (m/s) in the window's canonical world frame (heading\
        \ of net displacement \u2192 +X), 4 sub-patches per 0.32 s patch (0.08 s resolution)"
      head: ViT1DOdomDecoder (1 layer, hidden 192)
    selection:
      split: val
      monitor: val_loss
      mode: min
    eval_split: val
    metrics:
      primary: ate_m
      ate_m:
        higher_is_better: false
        fmt: '{:.4f}'
        label: ATE (m)
        desc: mean absolute trajectory error of the cumulative-sum reconstruction
          over all val windows (scripts/eval_odom_nymeria_worldframe.py::reconstruct_and_score)
      drift_pct:
        higher_is_better: false
        fmt: '{:.2f}'
        label: drift (%)
        desc: final-position error / path length over windows with path > 0.1 m
      vel_mse:
        higher_is_better: false
        fmt: '{:.5f}'
        label: vel MSE
    scorer: bench.score.odometry
    templates:
      probe:
        config: configs/vit1d_odom_worldframe_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: odom_finetune_nymeria_real_wrist_worldframe_flu
        extra:
          freeze_encoder: true
      finetune:
        config: configs/vit1d_odom_worldframe_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: odom_finetune_nymeria_real_wrist_worldframe_flu
      scratch:
        config: configs/vit1d_odom_worldframe_supervised_nymeria_altattn_scratch.yaml
        objective_type: odom_nymeria_real_wrist_worldframe_flu
    recipe:
      trainer.early_stopping:
        enabled: true
        monitor: val_loss
        patience: 20
        min_delta: 0.0001
      logging.save_step_checkpoints: false
    recipe_by_protocol:
      probe:
        trainer.optim.lr: 0.0003
        vit1d.odom_decoder.hidden_size: 192
        vit1d.odom_decoder.num_hidden_layers: 12
        vit1d.odom_decoder.num_attention_heads: 4
        vit1d.odom_decoder.dropout: 0.1
    slurm:
      time: 08:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    legacy_runs:
      mae_11src/finetune: vit1d_odom_worldframe_finetune_nymeria_mae_multidata
      mae_5src/finetune: vit1d_odom_worldframe_finetune_nymeria_mae_realdata_ocdetect_eatingspeed_motionx_sonic
      scratch/scratch: vit1d_odom_worldframe_supervised_nymeria_altattn_scratch
    external:
      mobileposer:
        scored: true
        source: baselines/full_body_pose/SimplePoser/eval_nymeria_worldframe_odom.py
      tlio:
        metrics:
          ate_m: 0.151
          drift_pct: 38.79
          vel_mse: 0.02419
        source: "Experiments_table.md \xA74b / baselines/odometry/TLIO"
      airio:
        metrics:
          ate_m: 0.1444
          drift_pct: 38.56
          vel_mse: 0.02461
        source: "Experiments_table.md \xA74b / baselines/odometry/Air-IO"
    _decoder_note: 'probe decoder promoted to arm d12b on 2026-08-27: chosen by the
      task''s primary metric over three ~12-layer variants, then applied to every
      encoder'
  odometry_nymeria_local:
    name: Odometry
    subtitle: "Nymeria real right-wrist IMU \u2192 pelvis velocity in the wrist (FLU) frame"
    family: odometry
    order: 3
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria pelvis trajectory)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
      val: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test: null
      split_rule: fixed pre-partitioned session directories (session-disjoint)
    input:
      channels: 6
      hz: 50
      window_seconds: 2.56
      T: 128
      frame: FLU
      gravity: included
    output:
      shape: '[P_t=8, K=4, 3]'
      desc: "3-D pelvis velocity (m/s) expressed in the wrist FLU frame at each sub-patch midpoint\
        \ (imu_lm/data/nymeria_real_wrist_odom_loader_FLU.py), 4 sub-patches per 0.32 s patch (0.08 s resolution)"
      head: ViT1DOdomDecoder (1 layer, hidden 192; 12 layers for the frozen probe)
    selection:
      split: val
      monitor: val_loss
      mode: min
    eval_split: val
    metrics:
      primary: ate_m
      ate_m:
        higher_is_better: false
        fmt: '{:.4f}'
        label: ATE (m)
        desc: mean absolute trajectory error over all val windows; predicted FLU velocities are rotated
          to the world frame with the ground-truth start orientation propagated by raw-gyro integration,
          then summed (bench/score/odometry_local.py, = scripts/eval_odom_nymeria_altattn.py::reconstruct_and_score)
      drift_pct:
        higher_is_better: false
        fmt: '{:.2f}'
        label: drift (%)
        desc: final-position error / path length over windows with path > 0.1 m
      vel_mse:
        higher_is_better: false
        fmt: '{:.5f}'
        label: vel MSE
    scorer: bench.score.odometry_local
    templates:
      probe:
        config: configs/vit1d_odom_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: odom_finetune_nymeria_real_wrist_flu
        extra:
          freeze_encoder: true
      finetune:
        config: configs/vit1d_odom_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: odom_finetune_nymeria_real_wrist_flu
      scratch:
        config: configs/vit1d_odom_supervised_nymeria_altattn_scratch.yaml
        objective_type: odom_nymeria_real_wrist_flu
    recipe:
      trainer.early_stopping:
        enabled: true
        monitor: val_loss
        patience: 20
        min_delta: 0.0001
      logging.save_step_checkpoints: false
    slurm:
      time: 08:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    _note: 'replaces odometry_nymeria_worldframe on 2026-09-18 (user decision): same data, windows, decoders,
      recipe and budgets; only the label frame (wrist FLU instead of per-window heading-canonical world frame)
      and the matching ATE reconstruction change. World-frame results are void.'
    _probe_decoder_2026_09_19: 'frozen-probe decoder reverted on 2026-09-19 (user decision) to the task template''s original decoder (arm: 2 layers, full body: 1 layer, odometry: 1 layer; width 192): with the deep decoder used from 2026-08-27 a never-trained frozen encoder matched the pretrained ones; those results live in odometry_nymeria_local_deepdec (appendix)'
  microgesture_openwatch:
    name: Microgesture
    subtitle: "OpenWatch wrist IMU \u2192 5 gestures + background (paper protocol,\
      \ real recordings)"
    family: classification
    order: 4
    dataset:
      name: OpenWatch (Bonazzi et al.), open_watch_without_augmentations
      root: /projects/b53017/vbc1591/openwatch_raw/open_watch_without_augmentations
      split_rule: contamination-safe posture-stratified subject split over canonical
        identities, seed 42, 80/10/10 (33/5/5 subjects; val 102 clips / test 87 clips)
      test: "yes \u2014 paper-comparable"
    input:
      channels: 6
      hz: 100
      window_seconds: 1.0
      T: 128
      frame: FLU
      gravity: included
      note: 1 s (100-sample) windows at stride 20 from a centred 2.0 s sub-interval
        (6 windows/clip), zero-padded to 128 samples after preprocessing
    output:
      shape: '[6]'
      desc: class logits per 1 s window; clip label = first run of k=3 identical window
        predictions, else majority (imu_lm/utils/clip_voting.py)
      head: LinearHead(384, 6)
    selection:
      split: val
      monitor: macro_f1
      mode: max
      note: "window-level val macro-F1 (paper \xA73.3.3), inverse-frequency class-weighted\
        \ CE"
    eval_split: test
    metrics:
      primary: clip_macro_f1
      clip_macro_f1:
        higher_is_better: true
        fmt: '{:.3f}'
        label: clip F1 (test)
      clip_acc:
        higher_is_better: true
        fmt: '{:.3f}'
        label: clip acc (test)
      window_macro_f1:
        higher_is_better: true
        fmt: '{:.3f}'
        label: win F1 (test)
      window_acc:
        higher_is_better: true
        fmt: '{:.3f}'
        label: win acc (test)
      val_clip_macro_f1:
        higher_is_better: true
        fmt: '{:.3f}'
        label: clip F1 (val)
      val_window_macro_f1:
        higher_is_better: true
        fmt: '{:.3f}'
        label: win F1 (val)
    recipe_by_protocol:
      finetune:
        trainer.optim.lr: 1.0e-05
    scorer: bench.score.microgesture
    templates:
      probe:
        config: configs/vit1d_gesture_probe_openwatch_6class_mae_multidata_flu_windowed_stratified.yaml
        objective_type: openwatch_gesture_probe
      finetune:
        config: configs/vit1d_gesture_finetune_openwatch_6class_mae_multidata_flu_windowed_stratified.yaml
        objective_type: openwatch_gesture_finetune
      scratch:
        config: configs/vit1d_gesture_supervised_openwatch_6class_altattn_scratch_windowed_stratified.yaml
        objective_type: openwatch_gesture_supervised
    recipe:
      trainer.early_stopping:
        enabled: true
        monitor: macro_f1
        mode: max
        patience: 20
      logging.save_step_checkpoints: false
      data.acc_scale: 0.0023942
      data.gyro_scale: 0.0012217
    slurm:
      time: 03:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    legacy_runs:
      mae_11src/probe: vit1d_gesture_probe_openwatch_6class_mae_windowed_strat
      mae_11src/finetune: vit1d_gesture_finetune_openwatch_6class_mae_windowed_strat
      mae_noaltattn/probe: vit1d_gesture_probe_openwatch_6class_mae_noaltattn_windowed_strat
      mae_acconly/probe: vit1d_gesture_probe_openwatch_6class_mae_acconly_windowed_strat
      focal/probe: vit1d_gesture_probe_openwatch_6class_focal_windowed_strat
      simmtm/probe: vit1d_gesture_probe_openwatch_6class_simmtm_windowed_strat
      relcon/probe: vit1d_gesture_probe_openwatch_6class_relcon_windowed_strat
      scratch/scratch: vit1d_gesture_supervised_openwatch_6class_altattn_scratch_windowed_strat
    external:
      mixtoken:
        metrics:
          clip_macro_f1: 0.5
          clip_acc: 0.621
          window_macro_f1: 0.49
          window_acc: 0.592
        source: results_openwatch_mixtoken_noaug.json (test)
        eval_split: test
      normwear:
        metrics:
          clip_macro_f1: 0.453
          clip_acc: 0.517
          window_macro_f1: 0.425
          window_acc: 0.504
        source: results_openwatch_normwear_protocol_noaug.json (test)
        eval_split: test
  language_humanml3d:
    name: Language alignment
    subtitle: "HumanML3D synthetic wrist IMU (UniMTS_data) \u2194 text retrieval"
    family: retrieval
    order: 5
    dataset:
      name: HumanML3D / UniMTS_data sim (right-wrist channel), aug_texts captions
      root: /projects/b53017/vbc1591/HumanML3D
      split_rule: HumanML3D official train/val/test lists (val 1,197 clips; test 3,701
        clips)
      test: 'yes'
    input:
      channels: 6
      hz: 50
      window_seconds: 10.24
      T: 512
      frame: FLU
      gravity: included
      note: clips wrap-padded to 512, deterministic first-crop; SO(3) rotation aug
        at train time
    output:
      shape: '[512]'
      desc: "L2-normalised IMU embedding in CLIP ViT-B/32 text space (ContrastiveCLIPHead);\
        \ text tower trainable, i2t InfoNCE, \u03C4=0.1 fixed"
      head: "ContrastiveCLIPHead(384\u2192512) + CLIP text tower"
    selection:
      split: none
      monitor: fixed_budget
      mode: latest
      note: "fixed 8k-step budget, final checkpoint (latest.pt); \xA713e: val-loss\
        \ best.pt under-selects for retrieval, latest \u2265 best on every arm"
    eval_split: test
    metrics:
      primary: r1_g100
      r1_g100:
        higher_is_better: true
        fmt: '{:.1f}'
        label: R@1 G=100 (mean i2t/t2i)
        desc: "mean of IMU\u2192Text and Text\u2192IMU Recall@1 over 200 random 100-item\
          \ galleries, first-caption protocol"
      r1_i2t_g100:
        higher_is_better: true
        fmt: '{:.1f}'
        label: i2t R@1
      r1_t2i_g100:
        higher_is_better: true
        fmt: '{:.1f}'
        label: t2i R@1
      mrr_i2t_g100:
        higher_is_better: true
        fmt: '{:.1f}'
        label: i2t MRR
      mrr_t2i_g100:
        higher_is_better: true
        fmt: '{:.1f}'
        label: t2i MRR
      r1_i2t_full:
        higher_is_better: true
        fmt: '{:.1f}'
        label: i2t R@1 full
      r1_t2i_full:
        higher_is_better: true
        fmt: '{:.1f}'
        label: t2i R@1 full
      mrr_i2t_full:
        higher_is_better: true
        fmt: '{:.1f}'
        label: i2t MRR full
      mrr_t2i_full:
        higher_is_better: true
        fmt: '{:.1f}'
        label: t2i MRR full
      val_r1_g100:
        higher_is_better: true
        fmt: '{:.1f}'
        label: R@1 G=100 (val)
    scorer: bench.score.language
    templates:
      probe:
        config: configs/retrieval_tune/lr1e-4_tau0.1fixed.yaml
        objective_type: imu_text_clip_flu
        extra:
          freeze_imu_encoder: true
      finetune:
        config: configs/retrieval_tune/lr1e-4_tau0.1fixed.yaml
        objective_type: imu_text_clip_flu
        extra:
          freeze_imu_encoder: false
      scratch:
        config: configs/retrieval_tune/lr1e-4_tau0.1fixed.yaml
        objective_type: imu_text_clip_flu
        extra:
          freeze_imu_encoder: false
    recipe:
      trainer.max_steps: 8000
      trainer.early_stopping:
        enabled: true
        monitor: val_loss
        patience: 1000
      logging.save_step_checkpoints: false
    checkpoint: latest
    slurm:
      time: 03:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    legacy_runs:
      mae_11src/finetune: rtune_lr1e-4_tau0.1fixed
    external:
      unimts:
        metrics:
          r1_g100: 17.6
          r1_i2t_g100: 33.6
          r1_t2i_g100: 1.6
          mrr_i2t_g100: 49.3
          mrr_t2i_g100: 6.4
        source: 'analysis/retrieval_eval/humanml3d__unimts_official_wrist.json (VAL
          split; contaminated: pretrained on HumanML3D)'
        eval_split: val
        status: invalid
      unimts_scratch:
        metrics:
          r1_i2t_g100: 24.85
