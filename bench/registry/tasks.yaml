    name: Odometry (deep probe decoder)
    subtitle: "Nymeria real right-wrist IMU \u2192 pelvis velocity in the wrist (FLU) frame"
    family: odometry
    order: 973
    dataset:
      name: Nymeria (real wrist IMU + Project-Aria pelvis trajectory)
      train: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
      val: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
      test: null
      split_rule: fixed pre-partitioned session directories (session-disjoint)
    input:
      channels: 6
      hz: 50
      window_seconds: 2.56
      T: 128
      frame: FLU
      gravity: included
    output:
      shape: '[P_t=8, K=4, 3]'
      desc: "3-D pelvis velocity (m/s) expressed in the wrist FLU frame at each sub-patch midpoint\
        \ (imu_lm/data/nymeria_real_wrist_odom_loader_FLU.py), 4 sub-patches per 0.32 s patch (0.08 s resolution)"
      head: ViT1DOdomDecoder (1 layer, hidden 192; 12 layers for the frozen probe)
    selection:
      split: val
      monitor: val_loss
      mode: min
    eval_split: val
    metrics:
      primary: ate_m
      ate_m:
        higher_is_better: false
        fmt: '{:.4f}'
        label: ATE (m)
        desc: mean absolute trajectory error over all val windows; predicted FLU velocities are rotated
          to the world frame with the ground-truth start orientation propagated by raw-gyro integration,
          then summed (bench/score/odometry_local.py, = scripts/eval_odom_nymeria_altattn.py::reconstruct_and_score)
      drift_pct:
        higher_is_better: false
        fmt: '{:.2f}'
        label: drift (%)
        desc: final-position error / path length over windows with path > 0.1 m
      vel_mse:
        higher_is_better: false
        fmt: '{:.5f}'
        label: vel MSE
    scorer: bench.score.odometry_local
    templates:
      probe:
        config: configs/vit1d_odom_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: odom_finetune_nymeria_real_wrist_flu
        extra:
          freeze_encoder: true
      finetune:
        config: configs/vit1d_odom_finetune_nymeria_mae_multidata_flu.yaml
        objective_type: odom_finetune_nymeria_real_wrist_flu
      scratch:
        config: configs/vit1d_odom_supervised_nymeria_altattn_scratch.yaml
        objective_type: odom_nymeria_real_wrist_flu
    recipe:
      trainer.early_stopping:
        enabled: true
        monitor: val_loss
        patience: 20
        min_delta: 0.0001
      logging.save_step_checkpoints: false
    recipe_by_protocol:
      probe:
        trainer.optim.lr: 0.0003
        vit1d.odom_decoder.hidden_size: 192
        vit1d.odom_decoder.num_hidden_layers: 12
        vit1d.odom_decoder.num_attention_heads: 4
        vit1d.odom_decoder.dropout: 0.1
    slurm:
      time: 08:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
