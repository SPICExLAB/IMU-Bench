# ---------------------------------------------------------------------------
# Aggregate columns: virtual tasks the leaderboard synthesises from member tasks
# (mean of the members' primary metric; a cell exists only when EVERY member is
# scored). Members carry `aggregate_into: <id>` and are hidden from the main
# tables (still in coverage + per-task detail).
aggregates:
  har_mean:
    name: "HAR (10 datasets)"
    subtitle: "mean window macro-F1 over 10 wrist HAR datasets (WISDM, UTD-MHAD, PAMAP2, RecoFit, HHAR, MHEALTH, SAMoSA, Shoaib, UT-Watch, PRISM)"
    order: 7
    members: [har_wisdm, har_utd_mhad, har_pamap2, har_recofit, har_hhar, har_mhealth, har_samosa, har_ut_watch, har_prism]
    min_members: 6      # show a partial mean (annotated with n) once this many members are scored
    metric: {key: mean_macro_f1, higher_is_better: true, fmt: "{:.3f}", label: "mean macro-F1 (10 sets)"}

grid:
  encoders: [mae_11src, mae_5src, mae_noaltattn, mae_acconly, focal, simmtm, relcon]
  protocols: [probe, finetune]
  scratch_encoder: scratch      # + one scratch cell per task
