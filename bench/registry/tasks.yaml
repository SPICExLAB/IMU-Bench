        monitor: macro_f1
        mode: max
        patience: 20
      logging.save_step_checkpoints: false
      frame_perturb:
        enabled: true
        mode: fixed
        rotation_set: so3
        seed: 7
    slurm:
      time: 03:00:00
      gres: gpu:1
      mem: 64G
      cpus: 8
    in_grid: false
    hidden: true
    frame_variant:
      of: microgesture_openwatch
