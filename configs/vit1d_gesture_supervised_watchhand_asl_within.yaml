##############################################################################
# Fully-supervised gesture classification — ASL gestures (10 classes)
# Split   : WITHIN-SUBJECT  (blocks 0–7 = train, blocks 8–9 = val)
#           Same 24 subjects contribute to both train and val.
# Dataset : WatchHand Study-1, right wrist, 50 Hz FLU
# Classes : ASL-0(0) through ASL-9(9)
# Encoder : ViT1D (same as MAE backbone)
# Head    : LinearHead(embed_dim → 10)
##############################################################################

vit1d:
  patch_size: 16
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    layer_norm_eps: 1.0e-6
  max_patches_per_channel: 256
  pooling: "mean"             # global-average pool tokens → [B, embed_dim]

objective:
  type: watchhand_gesture_supervised_within_subject
  watchhand_gesture_supervised_within_subject:
    pose_group: asl           # 10 classes: ASL-0 through ASL-9
    watchhand_root: /home/yiquan/TransfHAR/WatchHand
    studies: ["Study-1"]
    subjects: null
    target_hz: 50
    train_block_nums: [0, 1, 2, 3, 4, 5, 6, 7]
    val_block_nums:   [8, 9]
    # pretrained_run: vit1d_mae_nymeria
    # pretrained_ckpt: best

windowing:
  window_seconds: 2.56
  window_hop_ratio: 0.5

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size: 64
  eval_batch_size: 64
  num_workers: 4
  pin_memory: true

preprocess:
  impute:
    enabled: false
  filter:
    enabled: false
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-6

trainer:
  seed: 42
  amp: true
  max_steps: 50000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500

  optim:
    name: adamw
    lr: 3.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
