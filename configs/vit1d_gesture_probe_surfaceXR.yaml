##############################################################################
# Linear probe — SurfaceXR smartwatch gesture (9 classes)
# Dataset : SurfaceXR raw IMU (dataset_raw_imu.pkl)
#           Google Pixel Watch 3, right wrist, decimated 200→50 Hz, FLU frame
# IMU     : 6 channels = acc_F/L/U + gyro_F/L/U  (standard FLU 6-ch format)
# Window  : 128 samples = 2.56 s @ 50 Hz
# Classes : 0=no_gesture  1=SINGLE_TAP  2=DOUBLE_TAP  3=PINCH_IN  4=PINCH_OUT
#           5=SWIPE_UP    6=SWIPE_DOWN  7=SWIPE_LEFT  8=SWIPE_RIGHT
# Split   : LOPO — change test_user to hold out a different participant
# Encoder : ViT1D — FROZEN from pretrained_run; only LinearHead is trained
# Head    : LinearHead(embed_dim=384 → 9)
##############################################################################

vit1d:
  patch_size: 16            # 128 / 16 = 8 patches/channel (standard)
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0  # no dropout for frozen-encoder probing
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: surfaceXR_gesture_probe
  surfaceXR_gesture_probe:
    pkl_path:       /mnt/nas2/vasco/SurfaceXR/dataset_raw_imu.pkl
    test_user:      Timmy       # LOPO held-out user
    num_classes:    9
    apply_flu:      true
    split:          lopo
    # Pretrained encoder to freeze (required for probing):
    pretrained_run:  vit1d_gesture_supervised_surfaceXR_lopoTimmy  # ← update
    pretrained_ckpt: best

windowing:
  window_seconds: 2.56   # T = 2.56 × 50 = 128 samples

data:
  sensor_columns: [acc_F, acc_L, acc_U, gyro_F, gyro_L, gyro_U]
  batch_size:       512         # larger batch OK: encoder is frozen
  eval_batch_size:  512
  num_workers:      0
  pin_memory:       false

preprocess:
  impute:
    enabled: false
  filter:
    enabled: false
  normalize:
    enabled: false

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 250
  patience: 20

  optim:
    name: adamw
    lr: 1.0e-3                  # higher LR for head-only probing
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100
