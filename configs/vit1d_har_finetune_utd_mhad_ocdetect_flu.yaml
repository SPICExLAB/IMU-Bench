##############################################################################
# Finetune — UTD-MHAD action recognition (27 classes)
# Encoder warm-started from vit1d_mae_ocdetect_flu_v2, then trained end-to-end
# with the LinearHead.  Lower LR than probe to avoid catastrophic forgetting.
##############################################################################

vit1d:
  patch_size: 16
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    layer_norm_eps: 1.0e-6
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: utd_mhad_finetune
  utd_mhad_finetune:
    pretrained_run:  vit1d_mae_ocdetect_flu_v2
    pretrained_ckpt: best

windowing:
  window_seconds: 2.56

splits:
  val_ratio: 0.2   # 8 subjects → 2 val, 6 train

data:
  train_on_datasets: ["utd_mhad"]
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size:       128
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

preprocess:
  impute:
    enabled: false
  filter:
    enabled: false
  normalize:
    enabled: false

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 3.0e-5        # low LR to avoid catastrophic forgetting
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200
