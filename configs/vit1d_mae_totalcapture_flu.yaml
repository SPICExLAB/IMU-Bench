vit1d:
  patch_size: 16            # 128 / 16 = 8 time patches
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  decoder:
    hidden_size: 192
    num_hidden_layers: 4
    num_attention_heads: 4
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: mae_totalcapture_flu
  mask_ratio: 0.75
  mask_strategy: composite        # random | temporal | signal | composite
  mae_totalcapture_flu:
    pkl_root: /mnt/nas2/DIP_recalculate

    # Standard DIP/TotalCapture split: s1-s4 train, s5 val
    train_subjects: [s1, s2, s3, s4]
    val_subjects:   [s5]

    target_hz:   50         # resample raw 60 Hz → 50 Hz
    add_gravity: true       # add [0, -9.81, 0] to acc_world to simulate real MEMS reading

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
