# "Midtraining" v6: combines BOTH fixes tested separately in v4 and v5.
#
# Recap: v3 (encoder trainable, clip_head fresh) gave WISDM/PAMAP2 zero-shot
# wins but UTD-MHAD zero-shot collapsed to a single class ("arm curl",
# ~100% recall, 0% elsewhere, below the 1/21 random-guess floor).
# v4 (freeze_imu_encoder:true alone) did NOT fix the collapse (1.81%/1.21%,
# still single-class) -- ruled out encoder drift as the sole cause.
# v5 (clip_head now warm-started from the Stage-2 checkpoint via the
# run.py fix, encoder still trainable, text_projection_mlp disabled)
# meaningfully improved UTD-MHAD zero-shot (4.98%/2.84%, no longer a total
# collapse -- basketball shoot/clap/baseball swing now get real correct
# predictions too) and gave the BEST-EVER PAMAP2 zero-shot (28.01%/21.94%,
# nearly double UniMTS's 16.14%/12.71%) and finetune (61.44%/51.99%, beats
# UniMTS's 57.06%/44.78%) results of the whole session -- but WISDM zero-shot
# gave back a little ground vs v3 (27.53%/22.66% vs 30.59%/25.31%) and,
# notably, UTD-MHAD FINETUNE got WORSE (70.53%/69.45%, the worst of any
# midtrain variant) even though UTD-MHAD zero-shot improved -- since
# finetune only touches the encoder (fresh LinearHead + cross-entropy, no
# clip_head/text path involved at all), this means v5's still-TRAINABLE
# encoder drifted in a way that specifically hurts UTD-MHAD-relevant
# finetune features, even as the (separately-fixed) clip_head made
# zero-shot behavior healthier overall.
#
# v6 tests the natural next combination: freeze_imu_encoder:true (prevents
# the encoder drift that hurt v5's UTD-MHAD finetune) TOGETHER WITH the
# clip_head warm-start fix and text_projection_mlp:false (v5's zero-shot
# fix). Hypothesis: with the encoder now anchored AND the head no longer
# fresh/narrow, this should preserve (or improve on) v5's zero-shot health
# while recovering UTD-MHAD finetune quality back toward v3/v4's level
# (since a frozen encoder can't drift away from its Stage-2 state at all).

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  pos_embed_type: 2d
  max_patches_per_channel: 256
  max_channels: 32
  pooling: "mean"

  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true

objective:
  type: imu_text_clip_realdata
  imu_text_clip_realdata:
    clip_model:        openai/clip-vit-base-patch32
    clip_embed_dim:    512
    local_files_only:  true

    pretrained_run:  vit1d_clip_humanml3d_finetune_mae_multidata_anyrot
    pretrained_ckpt: best

    sentence_template: "The person is {}"

    freeze_imu_encoder:  true    # NEW vs v5 -- combine with the clip_head fix
    freeze_text_encoder: true
    text_projection_mlp: false
    text_mlp_hidden_dim: null

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

preprocess:
  normalize:
    enabled: false            # HumanML3D-CLIP checkpoint expects raw scale (see §10 configs)

windowing:
  window_seconds: 2.56

splits:
  seed: 42
  group_key: subject_id
  shuffle: true
  val_ratio: 0.1
  test_ratio: 0.0

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  train_on_datasets: ["recofit", "samosa", "shoaib", "ut_watch"]
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true

random_rotation:
  enabled: true
  rotation_set: so3

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500
  val_max_batches: 100

  optim:
    name: adamw
    lr: 3.0e-5
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
