# Probe for grid cell k25_f0p01 (K=25, 0.01%). See EXPERIMENTS.md 11l.
vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # must match the MAE checkpoint's patch embed
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0    # no dropout for frozen-encoder probing
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # checkpoint was trained with the alt-attn encoder
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: openwatch_gesture_probe
  openwatch_gesture_probe:
    root: /projects/b53017/vbc1591/openwatch_raw/open_watch_without_augmentations
    coordinate_frame: flu        # match how this source was fed during MAE pretrain
    num_classes: 6
    gestures:                    # order fixes the label ids: 0..4, "background" -> 5
      - double_clench
      - double_pinch
      - pinch_down
      - pinch_up
      - slide
    collapse_background: true
    background_label: background
    background_fraction: 0.2     # ~1985 raw non-target records -> ~397 kept
    # train_subjects / val_subjects / test_subjects: null -> auto 80/10/10 subject split
    pretrained_run:  vit1d_ssl_mae_grid_k25_f0p01
    pretrained_ckpt: best

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  window_seconds: 10.24    # match pretrain window so patch-position embeddings line up

splits:
  seed: 42
  val_fraction: 0.1
  test_fraction: 0.1

data:
  sensor_columns: [acc_F, acc_L, acc_U, gyro_F, gyro_L, gyro_U]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true              # MAE was trained with z-score normalization
    method: zscore
    eps: 1.0e-06

random_rotation:
  enabled: false                # frozen-encoder probe: evaluate on canonical orientation

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
