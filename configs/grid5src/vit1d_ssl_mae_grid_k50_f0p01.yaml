# Motion-types x volume grid, cell k50_f0p01 (EXPERIMENTS.md 11l).
# K=50 motion types, N=196 windows = 0.01% of the 1,959,288-window
# 5-source pool (3.9 windows per type). Types realised
# is verified == K by 10_grid_select.py (equal-per-cluster waterfill).
# Equal fixed budget of 50,000 steps across all 22 cells; early_stopping off
# so no cell can exit early and break the matched-budget premise.
# Pool is the 5 SSL sources; all 11 sources stay enabled in this config so the
# cache concat index space matches the index file, which alone does the
# restricting. Absolute numbers are self-contained to this grid (50K budget).
vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-06
    alt_attention: true
  decoder:
    hidden_size: 192
    num_hidden_layers: 4
    num_attention_heads: 4
    intermediate_size: 768
  max_patches_per_channel: 256
  pooling: mean
  pos_embed_type: 2d
objective:
  type: mae_multidata_varlen_altattn_flu
  loss_type: full_mse
  mask_ratio: 0.75
  mask_strategy: composite
  mae_multidata_varlen_altattn_flu:
    cache_dir: /projects/b53017/vbc1591/mae_multidata_cache_v3
    scaling_mode: index_file
    subset_indices_file: /projects/b53017/vbc1591/diversity_saturation/grid/idx_k50_f0p01.npy
    sampling_mode: natural
    sources:
      realdata:
        enabled: true
        train_on_datasets:
        - pamap2
        - recofit
        - samosa
        - shoaib
        - ut_watch
        - utd_mhad
        - wisdm
      ocdetect:
        enabled: true
        data_dir: /projects/b53017/vbc1591/OCDetect_extracted/preprocessed
        splits:
        - 0.8
        - 0.1
        - 0.1
        max_hours: 100000.0
        max_files: null
      nymeria:
        enabled: true
        train_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
        val_root: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
        add_gravity: true
      totalcapture:
        enabled: true
        root: /projects/b53017/vbc1591/DIP_recalculate
        train_subjects:
        - s1
        - s2
        - s3
        - s4
        val_subjects:
        - s5
        target_hz: 50
        add_gravity: true
      imuposer:
        enabled: true
        root: /projects/b53017/vbc1591/imuposer_dataset
        val_participants:
        - P9
        - P10
        target_hz: 50
        add_gravity: false
      eatingspeed:
        enabled: true
        root: /projects/b53017/vbc1591/EatingSpeed
        subsets:
        - FD-I
        - FD-II
        - MO
        splits:
        - 0.8
        - 0.1
        - 0.1
      motionx:
        enabled: true
        root: /projects/b53017/vbc1591/Motion-Xplusplus
        val_frac: 0.05
        add_gravity: true
      humanml3d:
        enabled: true
        root: /projects/b53017/vbc1591/HumanML3D
        t_min: 64
      sonic:
        enabled: true
        root: /projects/b53017/vbc1591/bones-seed
        add_gravity: true
      capture24:
        enabled: true
        root: /projects/b53017/vbc1591/capture24/capture24
        target_hz: 50
      openwatch:
        enabled: true
        root: /projects/b53017/vbc1591/openwatch_raw/open_watch_without_augmentations
        coordinate_frame: flu
      nhanes:
        enabled: false
        root: /projects/b53017/vbc1591/nhanes_pax
        splits:
        - 0.9
        - 0.1
        sample_fraction: 0.01
        max_hours: 2000.0
        target_hz: 50
data:
  batch_size: 128
  eval_batch_size: 128
  num_workers: 8
  pin_memory: true
  dataset_column: dataset
  label_column: dataset_activity_id
  label_name_column: dataset_activity_label
  session_column: session_id
  subject_column: subject_id
  time_column: timestamp_ns
  drop_na: false
  variable_length:
    enabled: true
    min_samples: 64
    max_samples: 512
paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs
preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-06
random_rotation:
  enabled: true
  rotation_set: octahedral
axis_bias:
  enabled: false
gain_jitter:
  enabled: false
gaussian_noise:
  enabled: false
time_warp:
  enabled: false
splits:
  group_key: subject_id
  seed: 42
  shuffle: true
  test_ratio: 0
  val_ratio: 0.05
windowing:
  window_seconds: 10.24
  window_hop_ratio: 0.5
  label_policy: center
  majority_threshold: 0.8
  handle_gaps: true
  gap_method: interpolate
  max_gap_ms: 200
  max_gaps_per_session: 100
trainer:
  seed: 42
  amp: true
  max_steps: 50000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000
  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
  sched:
    name: cosine
    warmup_steps: 500
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 999999
    min_delta: 0.0001
logging:
  log_every_steps: 5
  ckpt_every_steps: 10000
  save_step_checkpoints: false
wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
