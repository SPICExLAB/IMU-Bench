# Probe for grid cell k1000_f10 (K=1000, 10.00%). See EXPERIMENTS.md 11l.
vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # must match the MAE checkpoint's patch embed
  use_cls_token: false
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.0
    alt_attention: true
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: utd_mhad_probe          # generic linear-probe objective: frozen encoder + LinearHead
  utd_mhad_probe:
    pretrained_run:  vit1d_ssl_mae_grid_k1000_f10
    pretrained_ckpt: best

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

preprocess:
  normalize:
    enabled: true              # MAE was trained with z-score normalization

windowing:
  window_seconds: 2.56
  # PAMAP2 has highly variable per-subject gap counts (1-594 observed) due to
  # real-world sensor dropout -- the repo-wide default max_gaps_per_session: 100
  # (base.yaml) rejected every session assigned to val by the random
  # subject-group split, leaving val with 0 windows (see EXPERIMENTS.md).
  # Raised comfortably above the observed max.
  max_gaps_per_session: 700

splits:
  val_ratio: 0.2

data:
  train_on_datasets: ["pamap2"]
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

logging:
  ckpt_every_steps: 500
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

trainer:
  seed: 42
  amp: true
  max_steps: 40000              # PAMAP2 is much larger (~1.27M rows, 9 subjects) than WISDM/UTD-MHAD
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 400

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
