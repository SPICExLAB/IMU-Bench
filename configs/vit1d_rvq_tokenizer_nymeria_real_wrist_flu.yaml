# Discrete IMU tokenizer: frequency-progressive RVQ on Nymeria real wrist IMU (FLU frame).
#
# Same RVQ architecture as vit1d_rvq_tokenizer_ocdetect_anyrot/flu but trained on
# Nymeria real wrist pkl files instead of OCDetect CSV files.
# Signal: real wrist IMU in FLU body frame at 50 Hz, add_gravity=true.

vit1d:
  patch_size: 16
  shared_kernel: "acc_gyro"
  use_cls_token: false
  encoder:
    hidden_size: 256
    num_hidden_layers: 6
    num_attention_heads: 4
    intermediate_size: 1024
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.05

objective:
  type: rvq_tokenizer_nymeria_real_wrist_flu
  rvq_tokenizer_nymeria_real_wrist_flu:
    # Data
    train_pkl_root: /mnt/nas2/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /mnt/nas2/processed_data_test_body_Ty_rwrist
    val_files: all
    add_gravity: true

    # RVQ hyperparameters
    num_levels:         4
    num_codes:          512
    code_dim:           256
    ema_decay:          0.95
    commitment_weight:  0.05
    decoder_hidden_dim: 512

    # Frequency-band targets
    cutoff_hz:    [2.0, 5.0, 12.0, 999.0]
    lambda_levels: [1.0, 1.0, 1.0, 1.0]

    lambda_spec:  0.1
    fs:           50.0

    pool_channels: true
    num_channels:  6

random_rotation:
  enabled: false              # Nymeria is already in a consistent FLU body frame

time_crop:
  enabled: true
  min_crop_ratio: 0.90

gaussian_noise:
  enabled: true
  sigma: 0.01

data:
  batch_size: 256
  eval_batch_size: 256
  num_workers: 4
  pin_memory: true

logging:
  ckpt_every_steps: 5000

trainer:
  seed: 42
  amp: true
  max_steps: 300000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500

  optim:
    name: adamw
    lr: 0.0003
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 2000

  early_stopping:
    enabled: false
    monitor: val_loss
    patience: 20
