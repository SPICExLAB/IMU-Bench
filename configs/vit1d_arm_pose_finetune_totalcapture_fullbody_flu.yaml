vit1d:
  patch_size: 16
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  pose_decoder:
    hidden_size: 192
    num_hidden_layers: 2
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: pose                        # encoder + pose decoder both trainable
  pose:
    pretrained_run:  vit1d_full_body_pose_supervised_totalcapture_flu   # warm-start encoder from full-body pose supervised on TotalCapture
    pretrained_ckpt: best
    loader: totalcapture_real_wrist_flu

    pkl_root: /mnt/nas2/DIP_recalculate
    train_subjects: [s1, s2, s3, s4]
    val_subjects:   [s5]

    num_joints:  5          # right-arm chain: [R_Collar, R_Shoulder, R_Elbow, R_Wrist, R_Hand]
    target_hz:   50
    add_gravity: true
    lr: 0.00005

data:
  sensor_columns: ["acc_x", "acc_y", "acc_z", "gyro_x", "gyro_y", "gyro_z"]
  batch_size: 256
  num_workers: 4

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000
