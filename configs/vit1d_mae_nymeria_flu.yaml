vit1d:
  patch_size: 16            # 128 / 16 = 8 time patches
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  decoder:
    hidden_size: 192
    num_hidden_layers: 4
    num_attention_heads: 4
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: mae_nymeria_flu
  mask_ratio: 0.75
  mask_strategy: composite        # random | temporal | signal | composite
  mae_nymeria_flu:
    train_pkl_root: /mnt/nas2/processed_data_body_Ty
    train_files: all
    val_pkl_root: /mnt/nas2/processed_data_test_body_Ty
    val_files: all

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 10
    min_delta: 0.0001
