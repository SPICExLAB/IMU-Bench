# WISDM activity-recognition FINETUNE, warm-started from the HumanML3D-CLIP
# checkpoint (vit1d_clip_humanml3d_finetune_mae_multidata, 33.00%/34.25%
# imu<->text retrieval on HumanML3D -- see EXPERIMENTS.md §6) instead of the
# plain-MAE checkpoint used in the sibling
# vit1d_har_finetune_wisdm_mae_multidata_flu.yaml. Tests whether HumanML3D
# language-alignment pretraining helps as an encoder INIT for standard
# supervised HAR classification -- same recipe as that sibling config in
# every other respect (utd_mhad_finetune objective: warm-started encoder +
# fresh LinearHead + cross-entropy, matching UniMTS's own finetune_custom.py
# --mode full recipe exactly), so the only variable is the warm-start
# checkpoint.
#
# preprocess.normalize is explicitly DISABLED here (unlike the plain-MAE
# sibling, which enables z-score normalization): the HumanML3D-CLIP
# checkpoint's own training config
# (vit1d_clip_humanml3d_flu_finetune_mae_multidata.yaml) has no
# preprocess/normalize block, i.e. it was itself finetuned on raw
# (unnormalized) HumanML3D synthetic IMU -- so by the time THIS checkpoint's
# encoder weights were saved, they're calibrated for raw-scale input, not
# z-scored. Matching that here (rather than reusing the MAE sibling's
# normalize:true) avoids introducing a preprocessing mismatch between what
# the encoder currently expects and what it's fed during this finetune.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  use_cls_token: false
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.0
    alt_attention: true
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: utd_mhad_finetune       # generic finetune objective: warm-started encoder + LinearHead
  utd_mhad_finetune:
    pretrained_run:  vit1d_clip_realdata_midtrain2_from_humanml3d
    pretrained_ckpt: best

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

preprocess:
  normalize:
    enabled: false             # see header note -- HumanML3D-CLIP checkpoint expects raw scale

windowing:
  window_seconds: 2.56

splits:
  val_ratio: 0.2

data:
  train_on_datasets: ["wisdm"]
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

logging:
  ckpt_every_steps: 500
  save_step_checkpoints: false

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
