# Arm-pose linear probe on TotalCapture DIP IMU: frozen encoder from the
# combined-multidata MAE pretrain (vit1d_ssl_mae_varlen_altattn_multidata,
# alt-attn ViT1DEncoder) + trainable ViT1DPoseDecoder. 5 joints (wrist-side arm chain).

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # must match the MAE checkpoint's patch embed
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: false        # FOCAL baseline uses the plain (non-alt-attn) encoder
  pose_decoder:
    hidden_size: 192
    num_hidden_layers: 2
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: pose_probe
  pose_probe:
    pretrained_run:  vit1d_ssl_focal_multidata
    pretrained_ckpt: best
    loader: totalcapture_real_wrist_flu
    pkl_root: /projects/b53017/vbc1591/DIP_recalculate
    train_subjects: [s1, s2, s3, s4]
    val_subjects: [s5]
    target_hz: 50
    num_joints: 5
    add_gravity: true

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true

windowing:
  window_seconds: 10.24    # match pretrain window so patch-position embeddings line up
  window_hop_ratio: 0.5

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 20   # TotalCapture is tiny (~2 train batches/epoch) -- much more frequent eval than the Nymeria template this was cloned from

  optim:
    name: adamw
    lr: 0.0003
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 1000
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
