# Linear probe on UTD-MHAD using a frozen BEiT-pretrained encoder.
# Architecture matches vit1d_beit_ocdetect_anyrot_nopooling_8lvl.
# pretrained_run / pretrained_ckpt are overridden by eval_beit_ckpts.py.

vit1d:
  patch_size: 16
  shared_kernel: "acc_gyro"
  use_cls_token: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.0        # frozen encoder — no stochastic depth during eval
  max_patches_per_channel: 256  # must match pretraining default (base.yaml)
  pooling: "mean"              # mean-pool patch tokens — same as MAE probe

objective:
  type: utd_mhad_probe
  utd_mhad_probe:
    pretrained_run:  vit1d_beit_ocdetect_anyrot_nopooling_8lvl  # overridden per checkpoint
    pretrained_ckpt: latest                                       # overridden per checkpoint

preprocess:
  normalize:
    enabled: false             # match BEiT pretraining (OCDetect per-window z-score is separate)

windowing:
  window_seconds: 2.56

splits:
  val_ratio: 0.2

data:
  train_on_datasets: ["utd_mhad"]
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

logging:
  ckpt_every_steps: 500

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100
