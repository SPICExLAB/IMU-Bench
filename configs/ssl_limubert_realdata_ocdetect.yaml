# LIMU-BERT SSL pretraining on OCDetect + realdata (FLU, z-norm, balanced 50/50).
model:
  encoder_type: transformer         # shared backbone (LIMU-BERT Transformer); or resnet / cnn
  emb_norm: true
  feature_num: 6
  seq_len: 128
  # Size-matched to vit1d_ssl_mae_varlen_altattn_register_fullocd (~23.43M params)
  hidden: 1280
  n_layers: 4
  n_heads: 20
  hidden_ff: 5120
  # LIMU-BERT objective
  mask_ratio: 0.15                  # BERT-style span masking fraction

objective:
  mae_realdata_ocdetect_flu:
    ocdetect_data_dir: /mnt/nas2/yiquan_data/preprocessed
    ocdetect_splits: [0.8, 0.1, 0.1]
    max_ocdetect_hours: 500.0
    max_ocdetect_files: 120        # pre-cap files (~1000h raw) before windowing to bound RAM

data:
  batch_size: 128
  eval_batch_size: 128
  num_workers: 8
  pin_memory: true
  dataset_column: dataset
  label_column: dataset_activity_id
  session_column: session_id
  subject_column: subject_id
  time_column: timestamp_ns
  drop_na: false
  train_on_datasets:
    - pamap2
    - recofit
    - samosa
    - shoaib
    - ut_watch
    - utd_mhad
    - wisdm

paths:
  dataset_path: /mnt/nas2/yiquan_data/IMULM_master_dataset_v2.parquet
  runs_root: /home/yiquan/TransfHAR/runs/

preprocess:
  filter:    {enabled: true, type: lowpass, high_hz: 24, low_hz: 0.25, order: 4}
  impute:    {enabled: true, method: linear, max_missing_frac: 0.2}
  normalize: {enabled: true, method: zscore, eps: 1.0e-6}

random_rotation: {enabled: false}
axis_bias:      {enabled: false}
gain_jitter:    {enabled: false}
gaussian_noise: {enabled: false}
time_warp:      {enabled: false}

splits:
  group_key: subject_id
  seed: 42
  shuffle: true
  test_ratio: 0
  val_ratio: 0.05

windowing:
  window_seconds: 2.56
  window_hop_ratio: 0.5
  label_policy: center
  majority_threshold: 0.8
  handle_gaps: true
  gap_method: interpolate
  max_gap_ms: 200
  max_gaps_per_session: 100

trainer:
  seed: 42
  max_steps: 200000
  val_every_steps: 1000
  optim: {name: adamw, lr: 0.0003, weight_decay: 0.0001, betas: [0.9, 0.95], eps: 1.0e-8}
  early_stopping: {enabled: true, monitor: val_loss, patience: 15}

logging:
  log_every_steps: 20
  ckpt_every_steps: 10000

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
