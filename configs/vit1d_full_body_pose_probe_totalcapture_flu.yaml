vit1d:
  patch_size: 16
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  pose_decoder:
    hidden_size: 192
    num_hidden_layers: 2
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.15                       # encoder is frozen → only decoder dropout matters
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: pose_probe                  # frozen pretrained encoder + trainable pose decoder
  pose_probe:
    pretrained_run:  vit1d_mae_ocdetect_flu
    pretrained_ckpt: best

    loader: totalcapture_real_wrist_flu

    # TotalCapture DIP pkl directory
    pkl_root: /mnt/nas2/DIP_recalculate

    # Standard DIP/TotalCapture split: s1-s4 train, s5 test/val
    train_subjects: [s1, s2, s3, s4]
    val_subjects:   [s5]

    num_joints:  24         # full body: all 24 SMPL joints → y: [P, 144]
    target_hz:   50
    add_gravity: true

data:
  sensor_columns: ["acc_x", "acc_y", "acc_z", "gyro_x", "gyro_y", "gyro_z"]
  batch_size: 256
  num_workers: 4

trainer:
  seed: 42
  amp: true
  max_steps: 5000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500

  optim:
    name: adamw
    lr: 0.000001                      # higher LR fine since encoder is frozen
    weight_decay: 0.05
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 30

# Data augmentation
gaussian_noise:
  enabled: true
  sigma: 0.05

gain_jitter:
  enabled: true
  min_scale: 0.95
  max_scale: 1.05
