##############################################################################
# Linear probe — UTD-MHAD action recognition (27 classes)
# Data    : master parquet, dataset == "utd_mhad"
# Encoder : ViT1D — FROZEN from pretrained_run; only LinearHead is trained
# Head    : LinearHead(embed_dim=384 → num_classes discovered from data)
##############################################################################

vit1d:
  patch_size: 16
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: utd_mhad_probe
  utd_mhad_probe:
    pretrained_run:  vit1d_mae_ocdetect_flu_v2
    pretrained_ckpt: best

windowing:
  window_seconds: 2.56

splits:
  val_ratio: 0.2   # 8 subjects → 2 val, 6 train (base.yaml gives 0 val with 0.05 × 8 = 0)

data:
  train_on_datasets: ["utd_mhad"]
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true


trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20       # stop after 20 val checks (× 200 steps = 4000 steps) without improvement

  optim:
    name: adamw
    lr: 1.0e-3
    weight_decay: 0.1  # stronger L2 for linear probe on small dataset (was 0.01)
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100
