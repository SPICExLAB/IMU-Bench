# Full-body pose probe: frozen vit1d_mae_ocdetect_flu_no_norm_aug encoder + trainable pose decoder.
# Same architecture / data as the flu_23j variant but using the no-norm/anyrot pretrained encoder.

vit1d:
  patch_size: 16
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.0
  pose_decoder:
    hidden_size: 192
    num_hidden_layers: 1
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.2
    drop_path_rate: 0.0
    sub_patches: 4
    num_temporal_layers: 0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: pose_probe
  pose_probe:
    pretrained_run:  vit1d_mae_ocdetect_flu_no_norm_aug
    pretrained_ckpt: latest
    loader: nymeria_real_wrist_full_body_flu
    train_pkl_root: /mnt/nas2/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /mnt/nas2/processed_data_test_body_Ty_rwrist
    val_files: all
    num_joints: 23
    add_gravity: true
    reset_root_orientation: false
    jitter_weight: 0.0001
    joint_pos_weight: 10.0

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0003
    weight_decay: 0.05
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: step_decay
    warmup_steps: 500
    step_size: 500000
    factor: 0.5
    min_lr_ratio: 0.01

  early_stopping:
    enabled: false
    monitor: val_loss
    patience: 20
