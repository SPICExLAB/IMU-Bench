# Linear probe on SAMOSA (27 classes, 20 subjects) using frozen MAE encoder.
# Architecture matches vit1d_mae_ocdetect_flu checkpoint.

vit1d:
  patch_size: 16
  shared_kernel: true          # matches MAE checkpoint
  use_cls_token: false
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.0
  max_patches_per_channel: 256  # matches checkpoint's positional embedding table
  pooling: "mean"

objective:
  type: utd_mhad_probe         # generic enough — loads encoder + trains LinearHead
  utd_mhad_probe:
    pretrained_run:  vit1d_mae_ocdetect_flu
    pretrained_ckpt: best

preprocess:
  normalize:
    enabled: true              # MAE was trained with z-score normalization

windowing:
  window_seconds: 2.56

splits:
  val_ratio: 0.2              # 20 subjects → ~4 val, ~16 train

data:
  train_on_datasets: ["samosa"]
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

logging:
  ckpt_every_steps: 500

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100
