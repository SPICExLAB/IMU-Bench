# IMU<->text CLIP alignment FINETUNE on HumanML3D, retrained WITH random
# SO(3) rotation augmentation -- identical in every other respect to
# vit1d_clip_humanml3d_flu_finetune_mae_multidata.yaml (the config that
# produced 33.00%/34.25% imu<->text retrieval on HumanML3D itself, our
# current best "Ours(MAE+HumanML3D-CLIP)" checkpoint).
#
# Motivation: investigating why Ours(MAE+HumanML3D-CLIP) badly underperforms
# UniMTS on zero-shot HAR classification (see EXPERIMENTS.md §10). Checked
# UniMTS's own training code directly (baselines/language_alignment/UniMTS/
# pretrain.py + utils.py::augment_data) and found it applies a fresh random
# 3D rotation to every training sample's acc+gyro every batch -- explicit
# training for sensor-orientation invariance. Our HumanML3D-CLIP training
# has NEVER done this: it was trained purely on HumanML3D's one fixed,
# perfectly-canonical synthetic FLU-frame convention, with zero exposure to
# orientation variation. Real target-dataset sensors (WISDM/UTD-MHAD/PAMAP2)
# inevitably have calibration/mounting-angle variance relative to that one
# fixed synthetic convention -- a rotation-naive model has no way to be
# robust to that. This repo already has the exact same augmentation
# UniMTS uses (imu_lm/data/augmentations/transform.py::apply_random_rotation,
# uniform SO(3) via unit quaternion) already wired into HumanML3D's own
# loader (imu_lm/data/humanml3d_dataset_FLU.py calls apply_augment on the
# train split) -- just never turned on for this specific config. Retraining
# Stage 2 (not just continuing from the existing checkpoint, since we want a
# clean encoder that was rotation-augmented from the start) with this one
# change turned on to test the hypothesis directly, holding everything else
# fixed. This is a DIFFERENT axis of change than the earlier midtraining v1/v2
# experiments (which changed the DATA MIX/scale, not the augmentation) --
# both of those made zero-shot worse, so this tests a genuinely different
# mechanism instead of re-tuning the same one.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  pos_embed_type: 2d
  max_patches_per_channel: 256
  max_channels: 32
  pooling: "mean"

  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true

objective:
  type: imu_text_clip_flu
  imu_text_clip_flu:
    pretrained_run:  vit1d_ssl_mae_varlen_altattn_multidata
    pretrained_ckpt: best
    freeze_imu_encoder:  false
    freeze_text_encoder: true

    humanml3d_root: /projects/b53017/vbc1591/HumanML3D
    clip_model:     openai/clip-vit-base-patch32
    clip_embed_dim: 512
    local_files_only: true
    text_cache_path: /projects/b53017/vbc1591/HumanML3D/clip_text_emb_cache.pt

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

random_rotation:
  enabled: true               # uniform SO(3) on acc+gyro together -- see header note
  rotation_set: so3

# NEW (2026-07-25): HumanML3D's synthetic acceleration is derived as a pure
# second-order finite difference of wrist position (imu_lm/data/humanml3d_dataset_FLU.py
# ::_joints_to_imu_flu) -- it has never included gravity, confirmed empirically:
# per-axis mean acc ~0 on real cached clips, vs. real accelerometers (WISDM/
# PAMAP2/UTD-MHAD) whose |acc| median sits at ~9.8-10.3 m/s^2 (gravity reaction
# force). Per-window z-score normalization (already applied on both sides via
# base.yaml's default + HumanML3DIMUVarLenDatasetFLU's own hardcoded per-window
# z-score) removes each window's DC/mean, so a missing gravity constant alone
# doesn't survive to explain a distribution mismatch post-normalization -- but
# gravity's PROJECTION onto the sensor's own rotating axes (as the wrist turns
# relative to "down") is a genuine time-varying signal STRUCTURE that z-scoring
# cannot restore, and HumanML3D's synthesis has zero exposure to it. Confirmed
# HumanML3D's world frame is Y-up (pelvis/joint-0 height sits at Y=~0.95m with
# low variance; X/Z show unconstrained horizontal translation). gravity_mps2:
# 9.81 adds the correct reaction-force term (world +Y) to the kinematic
# acceleration BEFORE rotating into the FLU frame, so the synthetic signal
# reflects proper acceleration like a real accelerometer. Verified empirically:
# |acc| median jumps from 0.16-0.93 (no gravity) to 9.81 (with) on real clips,
# matching real target-dataset statistics almost exactly.
humanml3d:
  gravity_mps2: 9.81

windowing:
  min_window_seconds: 1.28
  max_window_seconds: 10.24

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size: 64
  num_workers: 4

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500
  val_max_batches: 100

  optim:
    name: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
