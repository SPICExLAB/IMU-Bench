# Odometry FINETUNE on Nymeria real-wrist IMU (wrist-FLU velocity target):
# encoder warm-started from the combined-multidata MAE pretrain
# (vit1d_ssl_mae_recipe_100pct, alt-attn ViT1DEncoder) but stays
# TRAINABLE end-to-end with the odom decoder (unlike the frozen probe sibling
# scored via scripts/eval_odom_nymeria_altattn.py). Same architecture as the
# Scratch baseline (vit1d_odom_supervised_nymeria_altattn_scratch.yaml) so the
# two are directly comparable -- this isolates "warm start from MAE" vs.
# "random init" on an otherwise-identical end-to-end training recipe.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # match the probe/MAE architecture
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # match the probe/MAE architecture
  odom_decoder:
    hidden_size: 192
    num_hidden_layers: 1
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: odom_finetune_nymeria_real_wrist_flu
  odom_finetune_nymeria_real_wrist_flu:
    pretrained_run: vit1d_ssl_mae_recipe_100pct
    pretrained_ckpt: best
    train_pkl_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
    val_files: all
    add_gravity: true

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    # Enabled (unlike vit1d_odom_supervised_nymeria_altattn_scratch.yaml, which
    # ran ~9-10h past convergence before being manually caught -- see
    # EXPERIMENTS.md's pipeline audit / infra notes).
    enabled: true
    monitor: val_loss
    patience: 20
    min_delta: 0.0001

logging:
  log_every_steps: 5
  ckpt_every_steps: 1000
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
