# DINOv2-style SSL on OCDetect wrist-IMU (any orientation).
#
# Two losses per step:
#   CLS loss  (DINO)  — cross-entropy on global CLS tokens (view-consistent repr)
#   Patch loss (iBOT) — cross-entropy on masked patch tokens (local motion repr)
#
# Two independently-augmented views per window: both receive a fresh uniform
# SO(3) random rotation + Gaussian noise, so no FLU alignment is assumed.
# The iBOT mask (40 %, temporal blocks) is applied INSIDE the student encoder
# (BERT-style [MASK] token replacement), not by dropping patches.
#
# Augmentation pipeline (applied twice per window, independent random draws):
#   random_rotation: uniform SO(3) on acc + gyro
#   gaussian_noise:  σ = 0.01
#   jitter: enabled (simulates micro-tremors / sensor drift)

vit1d:
  patch_size: 16               # 128 / 16 = 8 time patches per channel → 48 tokens total
  shared_kernel: "acc_gyro"   # separate Conv1d for acc (ch0-2) and gyro (ch3-5)
  use_cls_token: true          # DINO requires CLS token prepended before transformer
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.1
  dino_head:
    out_dim: 512               # prototype vocabulary size K (IMU simpler than image → 512 vs 4096)
    hidden_dim: 2048           # MLP intermediate width
    bottleneck_dim: 256        # dimension before L2-norm + weight-norm projection
  max_patches_per_channel: 8    # 128 samples / patch_size 16 = 8 patches per channel
  pooling: "cls"

objective:
  type: dino_ocdetect_anyrot
  mask_ratio: 0.40             # 40 % of patch tokens masked for iBOT loss
  mask_strategy: "random,temporal"   # per-sample random pick: uniform scatter OR time-block
  dino_ocdetect_anyrot:
    data_dir: /mnt/nas2/yiquan_data/preprocessed
    splits: [0.8, 0.1, 0.1]
    apply_flu_transform: false  # keep raw Android frame; SO(3) augment covers all orientations
    ema_momentum_start: 0.994   # teacher EMA momentum at step 0 (DINOv2: start high, not 0.9)
    ema_momentum: 0.9996        # teacher EMA momentum at max_steps
    freeze_last_layer_steps: 1000  # freeze prototype directions during LR warmup (original DINO trick)
    loss:
      teacher_temp: 0.07        # DINOv2 final teacher temperature (softer → harder targets)
      warmup_teacher_temp: 0.04       # starting temp: sharp distribution, collapse prevention
      warmup_teacher_temp_steps: 10000  # linear warmup 0.04→0.07 over first 10K steps
      student_temp: 0.10
      center_momentum: 0.99     # EMA momentum for centering buffer (collapse prevention)
      lambda_patch: 1.0         # weight on iBOT patch loss relative to DINO CLS loss
      lambda_koleo: 0.1         # weight on KoLeo regularizer (spread on unit hypersphere)

preprocess:
  impute:
    enabled: true
  filter:
    enabled: true
  normalize:
    enabled: false             # no z-norm: random rotation must not assume canonical mean

random_rotation:
  enabled: true                # uniform SO(3) on acc+gyro together

gaussian_noise:
  enabled: true
  sigma: 0.01                  # primary additive noise pass

jitter:
  enabled: true
  sigma: 0.003                 # second independent noise pass at smaller sigma

bias_drift:
  enabled: true
  max_drift: 0.05              # random-walk drift amplitude (sensor units); gyro bias ~0.05 rad/s

sensor_dropout:
  enabled: true
  p: 0.1                       # 10% chance to zero each channel independently

time_crop:
  enabled: true
  min_crop_ratio: 0.90         # crop between 90-100% of window, resample to full length

frequency_mask:
  enabled: true
  max_mask_fraction: 0.20      # mask up to 20% of frequency bins per channel
  n_masks: 1

data:
  batch_size: 256
  eval_batch_size: 256
  num_workers: 4
  pin_memory: true

logging:
  ckpt_every_steps: 10000       # save checkpoint every 10K steps

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.04            # DINOv2: 0.04 (was 0.0001, 40× too low)
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 1000         # longer warmup: teacher needs time to stabilise before centering

  early_stopping:
    enabled: false
    monitor: val_loss
    patience: 10
    min_delta: 0.0001
