# MAE pretraining on Nymeria real-wrist IMU ONLY (no other sources mixed in) --
# the exact same 867 train / 101 val session split used to train MobilePoser
# (baselines/full_body_pose/SimplePoser), for a controlled comparison against
# Ours(MAE) (pretrained on the 11-source multidata mix) that isolates two
# variables at once: pretraining DATA (Nymeria-only vs. multidata) and
# NORMALIZATION (z-score disabled here, unlike every other column in this
# benchmark -- see preprocess.normalize.enabled: false below).
#
# Architecture matches Ours(MAE) (vit1d_ssl_mae_varlen_altattn_multidata_flu.yaml)
# exactly (alt-attn encoder, same decoder/patch/mask settings) so any
# downstream difference traces back to data + normalization, not architecture.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  pos_embed_type: 2d
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true
  decoder:
    hidden_size: 192
    num_hidden_layers: 4
    num_attention_heads: 4
    intermediate_size: 768
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: mae_nymeria_real_wrist_flu
  mask_ratio: 0.75
  mask_strategy: composite
  mae_nymeria_real_wrist_flu:
    train_pkl_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
    val_files: all
    add_gravity: true

paths:
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

data:
  batch_size: 128
  eval_batch_size: 128
  num_workers: 8
  pin_memory: true

preprocess:
  normalize:
    enabled: false   # <-- the variable under test: no z-score normalization

random_rotation:
  enabled: true
  rotation_set: octahedral

windowing:
  window_seconds: 10.24
  window_hop_ratio: 0.5

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 15
    min_delta: 0.0001

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
