# Full-body pose linear probe on Nymeria real-wrist IMU: frozen encoder from
# vit1d_mae_nymeria_only_nonorm_altattn (MAE pretrained on Nymeria-only data,
# no z-normalization) + trainable ViT1DPoseDecoder. Sibling to
# vit1d_full_body_pose_probe_nymeria_mae_multidata_flu.yaml -- same task/decoder
# config, different (Nymeria-only, unnormalized) pretrained encoder.
# 23 joints (exclude root/joint-0), 4 sub-patches per 0.32 s patch -> 0.08 s resolution.
#
# preprocess.normalize.enabled: false is REQUIRED here to match the encoder's
# training distribution -- it was never shown normalized input.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true
  pose_decoder:
    hidden_size: 192
    num_hidden_layers: 1
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.2
    sub_patches: 4
    num_temporal_layers: 0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: pose_probe
  pose_probe:
    pretrained_run: vit1d_mae_nymeria_only_nonorm_altattn
    pretrained_ckpt: best
    loader: nymeria_real_wrist_full_body_flu
    train_pkl_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
    val_files: all
    num_joints: 23
    add_gravity: true
    reset_root_orientation: false
    jitter_weight: 0.0001
    joint_pos_weight: 10.0

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true

preprocess:
  normalize:
    enabled: false   # must match pretraining -- encoder never saw normalized input

windowing:
  window_seconds: 10.24
  window_hop_ratio: 0.5

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0003
    weight_decay: 0.05
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: step_decay
    warmup_steps: 500
    step_size: 500000
    factor: 0.5
    min_lr_ratio: 0.01

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 1000
  save_step_checkpoints: false

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
