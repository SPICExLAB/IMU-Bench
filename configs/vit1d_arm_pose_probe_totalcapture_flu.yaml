vit1d:
  patch_size: 16
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  pose_decoder:
    hidden_size: 192
    num_hidden_layers: 2
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: pose_probe                  # frozen encoder + trainable pose decoder only
  pose_probe:
    # Load pretrained encoder and freeze it; only the pose decoder is updated.
    pretrained_run:  vit1d_mae_ocdetect_flu
    pretrained_ckpt: best
    loader: totalcapture_real_wrist_flu

    # TotalCapture DIP pkl directory
    pkl_root: /mnt/nas2/DIP_recalculate

    # Standard DIP/TotalCapture split: s1-s4 train, s5 test/val
    train_subjects: [s1, s2, s3, s4]
    val_subjects:   [s5]

    num_joints:  5          # right-arm chain: [R_Collar, R_Shoulder, R_Elbow, R_Wrist, R_Hand]
    target_hz:   50         # resample raw 60 Hz → 50 Hz (matches pretrained encoder)
    add_gravity: true       # add [0, -9.81, 0] to acc_world to simulate real MEMS reading

data:
  sensor_columns: ["acc_x", "acc_y", "acc_z", "gyro_x", "gyro_y", "gyro_z"]
  batch_size: 256
  num_workers: 4

trainer:
  seed: 42
  amp: true
  max_steps: 5000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500

  optim:
    name: adamw
    lr: 0.000001              # higher LR acceptable since encoder is frozen
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
