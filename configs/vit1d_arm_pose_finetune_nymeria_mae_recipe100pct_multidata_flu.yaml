# Arm-pose FINETUNE on Nymeria real-wrist IMU: encoder warm-started from the
# combined-multidata MAE pretrain (vit1d_ssl_mae_recipe_100pct,
# alt-attn ViT1DEncoder) but stays TRAINABLE (unlike the frozen probe sibling
# vit1d_arm_pose_probe_nymeria_mae_multidata_flu.yaml). 5 joints (wrist-side arm chain).

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # must match the MAE checkpoint's patch embed
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # checkpoint was trained with the alt-attn encoder
  pose_decoder:
    hidden_size: 192
    num_hidden_layers: 2
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: pose        # unlike pose_probe, this keeps the warm-started encoder trainable
  pose:
    pretrained_run: vit1d_ssl_mae_recipe_100pct
    pretrained_ckpt: best
    loader: nymeria_real_wrist_flu
    train_pkl_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
    val_files: all
    num_joints: 5
    add_gravity: true

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true

windowing:
  window_seconds: 10.24    # match pretrain window so patch-position embeddings line up
  window_hop_ratio: 0.5

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001                  # full end-to-end finetune -> lower LR than head-only probing
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 1000
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
