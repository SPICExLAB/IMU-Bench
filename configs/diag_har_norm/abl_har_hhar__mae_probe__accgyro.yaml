vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  use_cls_token: false
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-06
    drop_path_rate: 0.0
    alt_attention: true
  max_patches_per_channel: 256
  pooling: mean
objective:
  type: utd_mhad_probe
  utd_mhad_probe:
    pretrained_run: vit1d_ssl_mae_varlen_altattn_multidata
    pretrained_ckpt: best
paths:
  dataset_path: /projects/b53017/vbc1591/hhar_dataset.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs
preprocess:
  normalize:
    enabled: false
windowing:
  window_seconds: 2.56
splits:
  val_ratio: 0.2
data:
  train_on_datasets:
  - hhar
  sensor_columns:
  - acc_x
  - acc_y
  - acc_z
  - gyro_x
  - gyro_y
  - gyro_z
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true
logging:
  ckpt_every_steps: 500
  save_step_checkpoints: false
trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200
  early_stopping:
    enabled: true
    patience: 20
    monitor: val_loss
  optim:
    name: adamw
    lr: 0.001
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
  sched:
    name: cosine
    warmup_steps: 100
  extra_best:
    macro_f1: max
wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
bench:
  task: har_hhar
  encoder: mae_11src
  protocol: probe
  seed: 42
  template: configs/vit1d_har_probe_hhar_mae_multidata_flu.yaml
  registry_version: 1
stats_concat:
  enabled: true
  features:
  - accphys
  - gyrodyn
  eps: 1.0e-06
  acc_scale: 9.81
  n_acc: 3
