vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-06
    alt_attention: true
  max_patches_per_channel: 256
  pooling: mean
objective:
  type: supervised
  supervised: {}
paths:
  dataset_path: /projects/b53017/vbc1591/mhealth_dataset.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs
windowing:
  window_seconds: 2.56
splits:
  val_ratio: 0.2
data:
  train_on_datasets:
  - mhealth
  sensor_columns:
  - acc_x
  - acc_y
  - acc_z
  - gyro_x
  - gyro_y
  - gyro_z
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true
preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: false
    method: zscore
    eps: 1.0e-06
trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200
  early_stopping:
    enabled: true
    patience: 20
    monitor: val_loss
  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
  sched:
    name: cosine
    warmup_steps: 200
logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false
wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
bench:
  task: har_mhealth
  encoder: scratch
  protocol: scratch
  seed: 42
  template: configs/vit1d_har_supervised_mhealth_altattn_scratch.yaml
  registry_version: 1
stats_concat:
  enabled: true
  eps: 1.0e-06
  acc_scale: 9.81
  n_acc: 3
