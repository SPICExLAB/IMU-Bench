##############################################################################
# SmartFallMM fall detection (right-wrist Meta sensor, 50 Hz, fall vs ADL) --
# same recipe as the HHAR sibling this file was derived from; only the dataset
# differs. Built by scripts/prepare_smartfallmm.py; label = global_activity_id
# (1 = ADL, 2 = fall), set by the task card's recipe.
##############################################################################
##############################################################################
# Fully supervised — HHAR (Stisen et al., SenSys 2015) activity recognition,
# trained FROM SCRATCH. Encoder + LinearHead trained end-to-end from random
# init (no pretrained weights). Uses the watch accelerometer + gyroscope
# streams (aligned by nearest-timestamp asof-merge, resampled to canonical
# 50 Hz — see scripts/prepare_hhar_dataset.py), not the phone streams, to
# match the wrist-worn convention used by most other HAR sources in this
# repo. Same architecture/preprocessing as the frozen MAE probe
# (vit1d_har_probe_hhar_mae_multidata_flu.yaml) so the two are directly
# comparable — this is the "no self-supervised pretraining" baseline.
##############################################################################

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: supervised

paths:
  dataset_path: /projects/b53017/vbc1591/smartfallmm_dataset.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  window_seconds: 2.56

splits:
  val_ratio: 0.2

data:
  train_on_datasets: ["smartfallmm"]
  label_column: global_activity_id
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-06

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
