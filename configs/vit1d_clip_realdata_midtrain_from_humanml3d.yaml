# "Midtraining" stage: continue CLIP language-alignment from the
# HumanML3D-CLIP checkpoint (vit1d_clip_humanml3d_finetune_mae_multidata,
# 33.00%/34.25% imu<->text retrieval on HumanML3D) onto a broad mix of REAL
# wrist-worn HAR datasets -- recofit (123 classes), samosa (27), shoaib (13),
# ut_watch (24) -- via the existing imu_text_clip_realdata objective
# ("The person is {activity}" templated captions, same recipe already used
# by configs/vit1d_clip_realdata.yaml for from-scratch pretraining).
#
# Goal: HumanML3D alone gives the encoder rich motion-language signal but
# ZERO exposure to (a) real sensor noise/statistics or (b) short,
# activity-label-style captions -- exactly the two things a UniMTS-style
# zero-shot HAR classifier needs and HumanML3D can't provide on its own
# (see EXPERIMENTS.md §10's zero-shot writeup). This stage adds both, while
# deliberately EXCLUDING wisdm/utd_mhad/pamap2 from train_on_datasets so
# zero-shot/finetune evaluation on those 3 remains valid (no leakage) --
# mirroring UniMTS's own held-out-dataset zero-shot evaluation paradigm
# rather than training directly on the test targets.
#
# Architecture block matches the HumanML3D-CLIP checkpoint exactly (not
# vit1d_clip_realdata.yaml's own from-scratch block, which uses a different
# pos_embed_type/max_patches_per_channel and no alt_attention) so the
# encoder loads cleanly.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  pos_embed_type: 2d
  max_patches_per_channel: 256
  max_channels: 32
  pooling: "mean"

  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true

objective:
  type: imu_text_clip_realdata
  imu_text_clip_realdata:
    clip_model:        openai/clip-vit-base-patch32
    clip_embed_dim:    512
    local_files_only:  true

    pretrained_run:  vit1d_clip_humanml3d_finetune_mae_multidata
    pretrained_ckpt: best

    sentence_template: "The person is {}"

    freeze_imu_encoder:  false
    freeze_text_encoder: true
    text_projection_mlp: true
    text_mlp_hidden_dim: null

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

preprocess:
  normalize:
    enabled: false            # HumanML3D-CLIP checkpoint expects raw scale (see §10 configs)

windowing:
  window_seconds: 2.56

splits:
  seed: 42
  group_key: subject_id
  shuffle: true
  val_ratio: 0.1
  test_ratio: 0.0

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  train_on_datasets: ["recofit", "samosa", "shoaib", "ut_watch"]
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500
  val_max_batches: 100

  optim:
    name: adamw
    lr: 3.0e-5
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
