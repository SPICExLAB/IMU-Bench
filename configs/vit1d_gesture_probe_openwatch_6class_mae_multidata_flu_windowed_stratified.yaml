##############################################################################
# WINDOWED + POSTURE-STRATIFIED variant — the OpenWatch paper's own protocol
# (arXiv:2605.04791), for a direct comparison against their Table 2:
#   * unit of prediction: 1s/100-sample windows @ stride 20 (not one whole
#     recording resampled to 10.24s) — `windowed: true` below; clip-level
#     numbers come from eval_openwatch_windowed_protocol.py's k=3
#     consecutive-run voting over the same windows.
#   * split: posture-stratified (splits.strategy), approximating the paper's
#     "balanced per posture and activity condition".
# Each 1s window is fed RAW (no resampling, no time stretch): zero-padded
# 100 -> 112 samples (7 x patch 16) after preprocessing (window_zero_pad).
# The varlen encoder accepts T=112 natively. Training and eval construct
# windows bit-identically, closing EXPERIMENTS.md §5d's train/eval mismatch.
# Also contamination_safe: dedup + canonical-identity split (release has
# duplicate subjects; aug ids 51-85 are mirrored copies — see §5f).
# Residual differences vs. the paper: IMU-only input, 100Hz signal read at
# the encoder's 50Hz-nominal pretrain timescale, unweighted CE + val_loss
# model selection (our conventions), best-effort split reconstruction.
##############################################################################

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # must match the MAE checkpoint's patch embed
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0    # no dropout for frozen-encoder probing
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # checkpoint was trained with the alt-attn encoder
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: openwatch_gesture_probe
  openwatch_gesture_probe:
    root: /projects/b53017/vbc1591/openwatch_raw/open_watch_without_augmentations
    coordinate_frame: flu        # match how this source was fed during MAE pretrain
    num_classes: 6
    gestures:                    # order fixes the label ids: 0..4, "background" -> 5
      - double_clench
      - double_pinch
      - pinch_down
      - pinch_up
      - slide
    collapse_background: true
    background_label: background
    background_fraction: 0.2     # ~1985 raw non-target records -> ~397 kept
    windowed: true               # paper protocol: 1s/100-sample windows...
    window_samples: 100          # ...@ 100Hz
    window_stride: 20            # ~11 windows per 300-sample recording
    window_zero_pad: true        # feed the RAW 1s slice (no resampling/stretch), zero-padded after preprocessing
    window_pad_len: 128          # pad into a 1.28s frame (8 x patch 16): 100 real samples + 28 zeros
    window_restrict_len: 200     # paper: windows come from a restricted sub-interval yielding 6/clip; we center the 2.0s interval
    contamination_safe: true     # dedup byte-identical files + canonical-identity split (see loader constants)
    class_weighted_ce: true      # paper §3.3.3: inverse-frequency class-weighted CE (fair vs Mix-Token/NormWear rows)
    # train_subjects / val_subjects / test_subjects: null -> auto split via splits.strategy
    pretrained_run:  vit1d_ssl_mae_varlen_altattn_multidata
    pretrained_ckpt: best

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  window_seconds: 10.24    # match pretrain window so patch-position embeddings line up

splits:
  seed: 42
  val_fraction: 0.1
  test_fraction: 0.1
  strategy: posture_stratified  # paper's split is posture/activity-balanced

data:
  sensor_columns: [acc_F, acc_L, acc_U, gyro_F, gyro_L, gyro_U]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true              # MAE was trained with z-score normalization
    method: zscore
    eps: 1.0e-06

random_rotation:
  enabled: false                # frozen-encoder probe: evaluate on canonical orientation

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20
    monitor: macro_f1           # paper §3.3.3: select/early-stop on val macro-F1 (fair vs Mix-Token/NormWear rows)

  optim:
    name: adamw
    lr: 1.0e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
