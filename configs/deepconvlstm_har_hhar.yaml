##############################################################################
# DeepConvLSTM (Ordonez & Roggen 2016) -- HHAR activity recognition,
# trained FROM SCRATCH (this repo has no SSL/pretraining variant of
# DeepConvLSTM). Same data/preprocessing/split as the ViT1D scratch/probe
# columns (vit1d_har_supervised_hhar_altattn_scratch.yaml) so it is directly
# comparable as an additional literature baseline in the HAR table.
##############################################################################

deepconvlstm:
  encoder:
    conv_filters: [64, 64, 64, 64]
    kernel_size: 5
    conv_dropout: 0.5
    lstm_hidden_size: 128
    lstm_num_layers: 2
    lstm_dropout: 0.5
    pooling: "last"

objective:
  type: supervised

paths:
  dataset_path: /projects/b53017/vbc1591/hhar_dataset.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  window_seconds: 2.56

splits:
  val_ratio: 0.2

data:
  train_on_datasets: ["hhar"]
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-06

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-3
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
