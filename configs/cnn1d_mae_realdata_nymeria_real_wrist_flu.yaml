# SAMoSA-style TCN encoder — MAE pretrain on realdata + Nymeria REAL wrist IMU (FLU frame)
# Comparison baseline for vit1d_mae_realdata_nymeria_real_wrist_flu.
# Dispatch: run_pretrain.py sees 'cnn1d' key → routes to CNN1D/run.py
cnn1d:
  encoder:
    conv_filters: [128, 128, 256, 256]
    kernel_size: 10
    stride: 1
    padding: 0
    use_batch_norm: true
    pool_size: 2
    pool_every: 2             # MaxPool after Conv2 and Conv4 (SAMoSA style)
    dropout: 0.5
    fc_dims: [1000, 500, 384] # output embed_dim=384 to match ViT1D

  decoder:
    decoder_hidden_size: 384
    decoder_num_layers: 4

objective:
  type: mae_realdata_nymeria_real_wrist_flu
  mask_ratio: 0.75
  mask_strategy: composite        # random | temporal | signal | composite
  mae_realdata_nymeria_real_wrist_flu:
    # Nymeria REAL wrist pkl sessions (FLU frame, real sensor readings)
    train_pkl_root: /mnt/nas2/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /mnt/nas2/processed_data_test_body_Ty_rwrist
    val_files: all
    add_gravity: true             # keep real IMU gravity component in output acc
    # Real parquet data pulled from paths.dataset_path filtered by
    # data.train_on_datasets (set in base.yaml):
    #   ["pamap2", "recofit", "samosa", "shoaib", "ut_watch", "utd_mhad", "wisdm"]

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
