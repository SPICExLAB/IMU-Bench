paths:
  runs_root: "/home/yiquan/TransfHAR/runs/"
  dataset_path: "/mnt/nas2/yiquan_data/IMULM_master_dataset_v2.parquet"

logging:
  log_every_steps: 5
  ckpt_every_steps: 200

wandb:
  project: TransfHAR_project
  entity: yli32258-northwestern-university

data:
  dataset_column: dataset
  subject_column: subject_id
  session_column: session_id
  time_column: timestamp_ns
  label_column: dataset_activity_id
  label_name_column: dataset_activity_label  # string activity name for metrics display
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z] 
  # train_on_datasets: ["wear"]          # null = all datasets (minus probe); or list e.g. [capture24, opportunity_plus_plus]
  train_on_datasets: ["pamap2", "recofit", "samosa", "shoaib", "ut_watch", "utd_mhad", "wisdm"] # ~153.9 hours
  # 6D datasets (acc+gyro): pamap2, recofit, samosa, shoaib, ut_watch, utd_mhad, wisdm  (~155h total, prism excluded as probe)
  # 3D datasets (acc only): wear, capture24, opportunity++
  drop_na: false
  num_workers: 8  # workers prefetch while GPU trains; parquet is in OS page-cache after epoch 1 so no NAS stampede
  pin_memory: true
  batch_size: 256
  eval_batch_size: 256

splits:
  seed: 0
  group_key: subject_id        
  shuffle: true
  probe_dataset: prism          # excluded from pretraining splits; used as probe eval target
  val_ratio: 0.05               # for non-probe training split only
  test_ratio: 0               # held-out test set (used by supervised eval) set to 0 when running MAE

windowing:
  window_seconds: 2.56
  window_hop_ratio: 0.5
  # label assignment for a window
  label_policy: center            # pure | majority | center | unknown_if_mixed
  majority_threshold: 0.8    
  handle_gaps: true
  gap_method: interpolate       # interpolate | split_segment | drop
  max_gap_ms: 200              
  max_gaps_per_session: 100

preprocess:
  impute:
    enabled: true
    method: linear            
    max_missing_frac: 0.2

  filter:
    enabled: true
    type: lowpass             
    order: 4
    low_hz: 0.25
    high_hz: 24

  normalize:
    enabled: true
    method: zscore             # zscore | robust | minmax
    eps: 1e-6

# Set spectrogram.enabled: true for ViT-MAE (converts to image); otherwise raw 1D [C, T]
spectrogram:
  enabled: false
  n_fft: 128
  win_length: 64
  hop_length: 2
  center: true
  return_image: false
  log_scale: false           # log1p before min-max [0,1] normalization (only when return_image: true)

gaussian_noise:
  enabled: false
  sigma: 0.6            

gain_jitter:
  enabled: false
  min_scale: 1.6
  max_scale: 5.1

time_warp:
  enabled: false
  max_warp: 0.05       
  smooth_sigma: 1       

axis_bias:
  enabled: false
  max_bias: 5.8