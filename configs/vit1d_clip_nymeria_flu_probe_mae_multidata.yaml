# IMU<->text CLIP alignment PROBE on Nymeria motion-narration captions —
# combined-multidata MAE encoder (vit1d_ssl_mae_varlen_altattn_multidata,
# alt-attn ViT1DEncoder), FROZEN (freeze_imu_encoder: true — only the
# projection head trains). Real recorded right-wrist IMU (FLU frame, same
# pipeline as every other Nymeria task in this benchmark), paired with
# Nymeria's own human-written motion-narration captions (downloaded via
# scripts/download_nymeria_captions.py), not synthetic AMASS-derived IMU
# the way the HumanML3D CLIP task is. Text side uses a pre-cached, frozen
# CLIP text embedding (openai/clip-vit-base-patch32; build via
# scripts/cache_clip_text_embeddings_nymeria.py).

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # must match the MAE checkpoint's patch embed
  pos_embed_type: 2d            # must match the MAE checkpoint (learned 2D pos-embed)
  max_patches_per_channel: 256  # must match the MAE checkpoint's pos-embed table size
  max_channels: 32
  pooling: "mean"

  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # checkpoint was trained with the alt-attn encoder

objective:
  type: imu_text_clip_nymeria_flu
  imu_text_clip_nymeria_flu:
    pretrained_run:  vit1d_ssl_mae_varlen_altattn_multidata
    pretrained_ckpt: best
    freeze_imu_encoder:  true   # PROBE: frozen encoder, only clip_head trains
    freeze_text_encoder: true

    captions_root:  /projects/b53017/vbc1591/nymeria_captions
    train_pkl_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
    val_pkl_root:   /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
    clip_model:     openai/clip-vit-base-patch32
    clip_embed_dim: 512
    local_files_only: true
    text_cache_path: /projects/b53017/vbc1591/nymeria_captions/clip_text_emb_cache.pt

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  min_window_seconds: 1.28    # T_min =  64 frames =  4 patches
  max_window_seconds: 10.24   # T_max = 512 frames = 32 patches -> matches pretrain window

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size: 64
  num_workers: 4

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500
  val_max_batches: 100   # val loader is infinite (resampled captions)

  optim:
    name: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
