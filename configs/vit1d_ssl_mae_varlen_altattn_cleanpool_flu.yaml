# ============================================================================
# "Clean pool" MAE pretraining: ZERO overlap with any downstream eval target,
# plus NHANES.  (created 2026-07-28)
#
# WHY THIS EXISTS
# ---------------
# Section 11's 11-source pool shares three sources with its own downstream
# evals, so those numbers are transductive rather than held-out-subject:
#   - realdata  contains pamap2/recofit/utd_mhad/wisdm -> the four HAR evals
#   - nymeria   -> arm-pose / full-body-pose / odometry evals
#   - openwatch -> the microgesture eval
# _build_realdata splits with base.yaml's val_ratio: 0.05, i.e. 95% of
# subjects land in pretraining train, while the HAR probes hold out 20% --
# and the two make_splits calls shuffle *different* group lists (7-dataset
# pooled vs. single-dataset), so a HAR val subject lands in pretraining train
# with ~95% probability. Encoders pretrained on that pool have seen nearly
# every eval subject's unlabeled signal.
#
# This config removes all three, keeping only sources with no eval
# counterpart anywhere in this benchmark, and adds NHANES. Downstream numbers
# from a checkpoint trained here ARE true held-out-subject generalization.
#
# ENABLED (6)                      disabled (6)
#   capture24   real free-living     realdata     -> HAR evals
#   ocdetect    real free-living     nymeria      -> pose/odom evals
#   eatingspeed real free-living     openwatch    -> gesture eval
#   sonic       synthetic BVH        humanml3d    (dropped per user's list)
#   motionx     synthetic SMPL-X     totalcapture (eval target in Sections 1-2)
#   nhanes      real free-living     imuposer     (eval target elsewhere)
#
# SIZE (measured; hop-based hours = windows x 5.12s, windows overlap 50%)
#   capture24    1,432,721 win   2,038h
#   ocdetect     1,253,077 win   1,782h
#   eatingspeed    575,356 win     818h
#   sonic           32,662 win      46h
#   motionx          4,683 win       7h
#   ---------------------------------------
#   subtotal     3,298,499 win   4,691h      (43.4% acc-only, from capture24)
#   + nhanes    ~3,375,000 win  ~4,800h      at the max_hours below
#   =======================================
#   TOTAL       ~6,673,000 win  ~9,491h      = 1.9x Section 11's 5,056h pool
#
# ** THE ONE KNOB THAT MATTERS: nhanes.max_hours **
# NHANES is ACCELEROMETER-ONLY (like capture24): its 3 "gyro" channels are
# zero-padded and masked out of the reconstruction loss via
# channel_valid_mask. So scaling NHANES trades total hours against how much
# gyro signal the encoder ever sees. Measured at ~135,105 windows (~192h,
# one full 7-8 day wear) per participant:
#     max_hours   NHANES h    pool h    vs S11   acc-only share of pool
#       1,900       1,921      6,613     1.3x          60%
#       4,800       4,804      9,495     1.9x          72%   <-- default here
#       9,600       9,607     14,299     2.8x          81%
#      48,000      48,037     52,729    10.4x          95%
# The default deliberately stops at ~2x the pool / 72% acc-only: enough new
# data to be a real test, before gyro becomes a rounding error. Section 11's
# fitted scaling law says halving the remaining reducible loss would need
# ~258,000h (~51x), which is only reachable by going acc-only-dominant --
# that is a real experiment to run, but it is a DIFFERENT experiment (it also
# changes the sensor mix), so it should not be conflated with this one.
#
# sample_fraction (0.005 = ~73 of 14,693 participants) caps which archives are
# even opened, before any I/O; max_hours then stops collection early via the
# streaming cap in nhanes_wrist_loader._collect_windows. Keep sample_fraction
# comfortably above what max_hours needs so the hours cap is what binds.
#
# Everything else (architecture, objective, mask_ratio, augmentation,
# trainer/optimizer, max_steps=300000) is byte-identical to
# vit1d_ssl_mae_varlen_altattn_multidata_flu_recipe100pct.yaml, so this run is
# directly comparable to Section 11's 100% row apart from the data pool.
#
# NOTE: built AFTER the 2026-07-28 val-augmentation fix, so its val loss is
# measured on a clean (un-augmented) val set -- comparable to Section 11a's
# "clean-val" column, NOT its "as-logged" column.
# ============================================================================
vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-06
    alt_attention: true
  decoder:
    hidden_size: 192
    num_hidden_layers: 4
    num_attention_heads: 4
    intermediate_size: 768
  max_patches_per_channel: 256
  pooling: mean
  pos_embed_type: 2d
objective:
  type: mae_multidata_varlen_altattn_flu
  loss_type: full_mse
  mask_ratio: 0.75
  mask_strategy: composite
  mae_multidata_varlen_altattn_flu:
    cache_dir: /projects/b53017/vbc1591/mae_multidata_cache_cleanpool
    sampling_mode: natural
    sources:
      realdata:
        enabled: false
        train_on_datasets:
        - pamap2
        - recofit
        - samosa
        - shoaib
        - ut_watch
        - utd_mhad
        - wisdm
      ocdetect:
        enabled: true
        data_dir: /projects/b53017/vbc1591/OCDetect_extracted/preprocessed
        splits:
        - 0.8
        - 0.1
        - 0.1
        max_hours: 100000.0
        max_files: null
      nymeria:
        enabled: false
        train_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
        val_root: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
        add_gravity: true
      totalcapture:
        enabled: false
        root: /projects/b53017/vbc1591/DIP_recalculate
        train_subjects:
        - s1
        - s2
        - s3
        - s4
        val_subjects:
        - s5
        target_hz: 50
        add_gravity: true
      imuposer:
        enabled: false
        root: /projects/b53017/vbc1591/imuposer_dataset
        val_participants:
        - P9
        - P10
        target_hz: 50
        add_gravity: false
      eatingspeed:
        enabled: true
        root: /projects/b53017/vbc1591/EatingSpeed
        subsets:
        - FD-I
        - FD-II
        - MO
        splits:
        - 0.8
        - 0.1
        - 0.1
      motionx:
        enabled: true
        root: /projects/b53017/vbc1591/Motion-Xplusplus
        val_frac: 0.05
        add_gravity: true
      humanml3d:
        enabled: false
        root: /projects/b53017/vbc1591/HumanML3D
        t_min: 64
      sonic:
        enabled: true
        root: /projects/b53017/vbc1591/bones-seed
        add_gravity: true
      capture24:
        enabled: true
        root: /projects/b53017/vbc1591/capture24/capture24
        target_hz: 50
      openwatch:
        enabled: false
        root: /projects/b53017/vbc1591/openwatch_raw/open_watch_without_augmentations
        coordinate_frame: flu
      nhanes:
        enabled: true
        root: /projects/b53017/vbc1591/nhanes_pax
        splits:
        - 0.9
        - 0.1
        sample_fraction: 0.005
        max_hours: 4800.0
        target_hz: 50
data:
  batch_size: 128
  eval_batch_size: 128
  num_workers: 8
  pin_memory: true
  dataset_column: dataset
  label_column: dataset_activity_id
  label_name_column: dataset_activity_label
  session_column: session_id
  subject_column: subject_id
  time_column: timestamp_ns
  drop_na: false
  variable_length:
    enabled: true
    min_samples: 64
    max_samples: 512
paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs
preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-06
random_rotation:
  enabled: true
  rotation_set: octahedral
axis_bias:
  enabled: false
gain_jitter:
  enabled: false
gaussian_noise:
  enabled: false
time_warp:
  enabled: false
splits:
  group_key: subject_id
  seed: 42
  shuffle: true
  test_ratio: 0
  val_ratio: 0.05
windowing:
  window_seconds: 10.24
  window_hop_ratio: 0.5
  label_policy: center
  majority_threshold: 0.8
  handle_gaps: true
  gap_method: interpolate
  max_gap_ms: 200
  max_gaps_per_session: 100
trainer:
  seed: 42
  amp: true
  max_steps: 300000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000
  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
  sched:
    name: cosine
    warmup_steps: 500
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 60
    min_delta: 0.0001
logging:
  log_every_steps: 5
  ckpt_every_steps: 10000
  save_step_checkpoints: false
wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
