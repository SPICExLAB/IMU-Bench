# Odometry regression on Nymeria pelvis motion, CANONICAL WORLD-FRAME target,
# trained FROM SCRATCH. Encoder + odom decoder trained end-to-end from random
# init (no pretrained weights).
#
# Unlike vit1d_odom_supervised_nymeria_altattn_scratch.yaml (predicts velocity
# in the wrist's own continuously-rotating FLU frame), this predicts velocity
# in a frame that's canonicalized ONCE per window: rotated about the vertical
# axis so the window's own net displacement points along +X (heading derived
# from movement direction, since pelvis body orientation isn't available in
# this dataset -- only position). See
# imu_lm/data/nymeria_real_wrist_odom_worldframe_loader_FLU.py for the full
# derivation. Same architecture as the frozen MAE probe
# (scripts/eval_odom_nymeria_worldframe.py against vit1d_ssl_mae_varlen_altattn_multidata)
# so the two are directly comparable.
#
# Window stays at base.yaml's default (2.56 s @ 50 Hz -> 128 samples ->
# patch_size 16 -> 8 time patches, y shape [B, 8, 4, 3]).

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # match the probe/MAE architecture
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # match the probe/MAE architecture
  odom_decoder:
    hidden_size: 192
    num_hidden_layers: 1
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: odom_nymeria_real_wrist_worldframe_flu   # encoder + odom decoder both trained from scratch
  odom_nymeria_real_wrist_worldframe_flu:
    # No pretrained_run — fully supervised from random init
    train_pkl_root: /projects/b53017/vbc1591/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /projects/b53017/vbc1591/processed_data_test_body_Ty_rwrist
    val_files: all
    add_gravity: true

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    # Enabled this time (unlike the wrist-FLU scratch config it mirrors) --
    # that one ran for ~9-10 hours past convergence before being manually
    # caught and cancelled. See EXPERIMENTS.md's pipeline-audit / infra notes.
    enabled: true
    monitor: val_loss
    patience: 20
    min_delta: 0.0001

logging:
  log_every_steps: 5
  ckpt_every_steps: 1000
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
