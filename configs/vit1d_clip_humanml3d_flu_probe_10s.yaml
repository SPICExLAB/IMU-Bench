vit1d:
  patch_size: 16
  shared_kernel: true
  pos_embed_type: sinusoidal
  # Fixed 10.24 s window: 10.24 s × 50 Hz / patch_size 16 = 32 patches per channel
  max_patches_per_channel: 32
  max_channels: 32
  pooling: "mean"

  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6

objective:
  type: imu_text_clip_flu
  imu_text_clip_flu:
    # Probe: warm-start encoder from the 10s MAE encoder and FREEZE it.
    # Only the ContrastiveCLIPHead (projection layer) is updated.
    pretrained_run:  vit1d_mae_realdata_nymeria_real_wrist_flu_10s
    pretrained_ckpt: best

    # Absolute path to the HumanML3D dataset root (must contain joints/ and texts/).
    humanml3d_root: /home/yiquan/HumanML3D

    # CLIP text encoder (HuggingFace identifier or local path).
    clip_model:        openai/clip-vit-base-patch32
    clip_embed_dim:    512
    freeze_text_encoder: true   # text encoder always frozen
    freeze_imu_encoder:  true   # PROBE: encoder is frozen, only projection is trained

    # Set to true if the CLIP model has been downloaded and should not be re-fetched.
    local_files_only: true

    # Optional: path to a pre-computed text embedding cache produced by
    #   python scripts/cache_clip_text_embeddings.py \
    #       --humanml3d-root /home/yiquan/HumanML3D \
    #       --out            /home/yiquan/HumanML3D/clip_text_emb_cache.pt
    text_cache_path: /home/yiquan/HumanML3D/clip_text_emb_cache.pt

# Fixed 10.24 s window (32 patches × 16 samples = 512 frames @ 50 Hz).
windowing:
  window_seconds: 10.24

data:
  sensor_columns: ["acc_x", "acc_y", "acc_z", "gyro_x", "gyro_y", "gyro_z"]
  batch_size: 512
  num_workers: 4

trainer:
  val_max_batches: 100
  seed: 42
  amp: true
  max_steps: 5000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500

  optim:
    name: adamw
    lr: 0.0003           # higher LR acceptable since encoder is frozen
    weight_decay: 0.0001
    betas: [0.9, 0.98]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
