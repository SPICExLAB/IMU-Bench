##############################################################################
# Fully-supervised gesture classification — SurfaceXR smartwatch (9 classes)
# Dataset : SurfaceXR raw IMU (dataset_raw_imu.pkl)
#           Google Pixel Watch 3, right wrist, decimated 200→50 Hz, FLU frame
# IMU     : 6 channels = acc_F/L/U + gyro_F/L/U  (standard FLU 6-ch format)
# Window  : 128 samples = 2.56 s @ 50 Hz (matches windowing.window_seconds=2.56)
# Classes : 0=no_gesture  1=SINGLE_TAP  2=DOUBLE_TAP  3=PINCH_IN  4=PINCH_OUT
#           5=SWIPE_UP    6=SWIPE_DOWN  7=SWIPE_LEFT  8=SWIPE_RIGHT
# Split   : LOPO — change test_user to hold out a different participant
# Encoder : ViT1D — same architecture as all other 6-ch 50-Hz encoders
#           patch_size=16 → 8 patches/channel, 6×8=48 tokens total
# Head    : LinearHead(embed_dim=384 → 9)
# Training: fully end-to-end (encoder + head); set pretrained_run to warm-start
##############################################################################

vit1d:
  patch_size: 16            # 128 / 16 = 8 patches/channel (standard)
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    layer_norm_eps: 1.0e-6
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: surfaceXR_gesture_supervised
  surfaceXR_gesture_supervised:
    pkl_path:    /mnt/nas2/vasco/SurfaceXR/dataset_raw_imu.pkl
    test_user:   Timmy          # LOPO held-out user (one of 15 participants)
    num_classes: 9
    apply_flu:   true           # permute raw channels to wrist FLU frame
    split:       lopo           # 'lopo' (default) or 'random'
    # Optional warm-start from a pretrained 6-channel 50-Hz encoder:
    # pretrained_run:  vit1d_mae_combined_flu
    # pretrained_ckpt: best     # 'best', 'latest', or absolute path to .pt

# Windowing: used only to derive T for meta-data; dataloader ignores this.
# 2.56 s × 50 Hz = 128 samples (matches the 128-sample windows in the loader).
windowing:
  window_seconds: 2.56

data:
  # 6-channel FLU: acc_F/L/U + gyro_F/L/U  (matches all other 50-Hz datasets)
  sensor_columns: [acc_F, acc_L, acc_U, gyro_F, gyro_L, gyro_U]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      0
  pin_memory:       false

preprocess:
  impute:
    enabled: true
  filter:
    enabled: true
  normalize:
    enabled: true   # raw IMU; add zscore normalization here if needed

trainer:
  seed: 42
  amp: true
  max_steps: 50000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500
  patience: 20

  optim:
    name: adamw
    lr: 3.0e-5
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500
