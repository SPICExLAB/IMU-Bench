vit1d:
  patch_size: 16            # T=128 → 8 patches; sub-patch Q=4 frames=0.08s @ 50 Hz
                            # y shape: [B, 8, 4, 3] (4 velocities × 3D per patch)
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  odom_decoder:
    hidden_size: 192
    num_hidden_layers: 2
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: local_vel_finetune_imuposer_flu
  local_vel_finetune_imuposer_flu:
    pretrained_run: vit1d_mae_realdata_nymeria_real_wrist_flu
    pretrained_ckpt: best
    train_pkl_root: /mnt/nas2/yiquan_data/IMUPoser/ioposer_with_hip_30hz_2/train
    train_files: all
    val_pkl_root: /mnt/nas2/yiquan_data/IMUPoser/ioposer_with_hip_30hz_2/test
    val_files: all
    add_gravity: false

data:
  window_size: 2.56         # seconds → T = 2.56 * 50 = 128 frames
  hop_size: 0.64            # seconds
  batch_size: 256
  eval_batch_size: 256
  num_workers: 4
  pin_memory: true

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.00005
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
