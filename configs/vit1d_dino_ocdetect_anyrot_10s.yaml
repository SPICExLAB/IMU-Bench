# DINOv2-style SSL on OCDetect wrist-IMU — 10.24 s window (512 samples @ 50 Hz).
#
# Same DINO/iBOT objective as vit1d_dino_ocdetect_anyrot.yaml but with a 4×
# longer context window:
#   2.56 s →  8 patches/channel →  48 tokens (6 ch × 8 patches)
#  10.24 s → 32 patches/channel → 192 tokens (6 ch × 32 patches)
#
# Longer windows give the model access to richer motion context (gait cycles,
# OCD rituals) in a single forward pass.  Batch size is reduced to keep
# GPU memory roughly constant relative to the 2.56 s config.

vit1d:
  patch_size: 16               # 512 / 16 = 32 patches per channel → 192 tokens total
  shared_kernel: "acc_gyro"   # separate Conv1d for acc (ch0-2) and gyro (ch3-5)
  use_cls_token: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.1
  dino_head:
    out_dim: 4096
    hidden_dim: 2048
    bottleneck_dim: 256
  max_patches_per_channel: 32  # 512 samples / 16 patch_size = 32 patches/channel
  pooling: "cls"

windowing:
  window_seconds: 10.24        # 512 samples @ 50 Hz
  window_hop_ratio: 0.5        # 50 % overlap → 256-sample hop between windows

objective:
  type: dino_ocdetect_anyrot
  mask_ratio: 0.40
  mask_strategy: "random,temporal"
  dino_ocdetect_anyrot:
    data_dir: /mnt/nas2/yiquan_data/preprocessed
    splits: [0.8, 0.1, 0.1]
    apply_flu_transform: false
    ema_momentum_start: 0.994
    ema_momentum: 0.9996
    freeze_last_layer_steps: 1000
    loss:
      teacher_temp: 0.07              # DINOv2 final teacher temperature
      warmup_teacher_temp: 0.04       # starting temp: sharp, collapse prevention
      warmup_teacher_temp_steps: 30000  # linear warmup 0.04→0.07 over first 30K steps
      student_temp: 0.10
      center_momentum: 0.99
      lambda_patch: 1.0
      lambda_koleo: 0.1

preprocess:
  impute:
    enabled: true
  filter:
    enabled: true
  normalize:
    enabled: false

random_rotation:
  enabled: true

gaussian_noise:
  enabled: true
  sigma: 0.01

jitter:
  enabled: true
  sigma: 0.003

bias_drift:
  enabled: true
  max_drift: 0.05

sensor_dropout:
  enabled: true
  p: 0.1

time_crop:
  enabled: true
  min_crop_ratio: 0.90

frequency_mask:
  enabled: true
  max_mask_fraction: 0.20
  n_masks: 1

data:
  batch_size: 128              # increased from 64 → smoother centering buffer updates
  eval_batch_size: 128
  num_workers: 4
  pin_memory: true

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.04            # DINOv2: 0.04 (was 0.0001, 40× too low)
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 1000

  early_stopping:
    enabled: false
    monitor: val_loss
    patience: 10
    min_delta: 0.0001
