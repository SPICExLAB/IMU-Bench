##############################################################################
# OpenWatch micro-gesture keyword-spotting (6 classes), trained FROM SCRATCH.
# Encoder + LinearHead trained end-to-end from random init (no pretrained
# weights). Same architecture/data/classes as the frozen MAE probe
# (vit1d_gesture_probe_openwatch_6class_mae_multidata_flu.yaml) so the two are
# directly comparable — this is the "no self-supervised pretraining" baseline.
# Classes: double_clench, double_pinch, pinch_down, pinch_up, slide, background
# (background = subsampled pool of every other OpenWatch gesture recording).
##############################################################################

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # match the probe/MAE architecture
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # match the probe/MAE architecture
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: openwatch_gesture_supervised
  openwatch_gesture_supervised:
    root: /projects/b53017/vbc1591/openwatch_raw/open_watch_without_augmentations
    coordinate_frame: flu
    num_classes: 6
    gestures:                    # order fixes the label ids: 0..4, "background" -> 5
      - double_clench
      - double_pinch
      - pinch_down
      - pinch_up
      - slide
    collapse_background: true
    background_label: background
    background_fraction: 0.2     # ~1985 raw non-target records -> ~397 kept
    # train_subjects / val_subjects / test_subjects: null -> auto 80/10/10 subject split
    # No pretrained_run — fully supervised from random init

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  window_seconds: 10.24

splits:
  seed: 42
  val_fraction: 0.1
  test_fraction: 0.1

data:
  sensor_columns: [acc_F, acc_L, acc_U, gyro_F, gyro_L, gyro_U]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-06

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-4                  # full end-to-end training -> lower LR than head-only probing
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
