# Arm-pose regression on TotalCapture DIP IMU, trained FROM SCRATCH.
# Encoder + ViT1DPoseDecoder trained end-to-end from random init (no pretrained
# weights). Same architecture as the frozen MAE probe
# (vit1d_arm_pose_probe_nymeria_mae_multidata_flu.yaml) so the two are directly
# comparable — this is the "no self-supervised pretraining" baseline.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # match the probe/MAE architecture
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # match the probe/MAE architecture
  pose_decoder:
    hidden_size: 192
    num_hidden_layers: 2
    num_attention_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: pose                          # encoder + pose decoder both trained from scratch
  pose:
    # No pretrained_run — fully supervised from random init
    loader: totalcapture_real_wrist_flu    # real wrist IMU (FLU) -> 5-joint right arm chain
    pkl_root: /projects/b53017/vbc1591/DIP_recalculate
    train_subjects: [s1, s2, s3, s4]
    val_subjects: [s5]
    target_hz: 50
    num_joints: 5                     # right-arm chain: [14 collar, 17 shoulder, 19 elbow, 21 wrist, 23 hand]
    add_gravity: true

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true

windowing:
  window_seconds: 10.24
  window_hop_ratio: 0.5

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 20   # TotalCapture is tiny (~2 train batches/epoch) -- much more frequent eval than the Nymeria template this was cloned from

  optim:
    name: adamw
    lr: 0.0003
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 1000
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
