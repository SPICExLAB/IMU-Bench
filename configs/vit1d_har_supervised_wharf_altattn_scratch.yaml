##############################################################################
# Fully supervised — WHARF (Wearable Human Activity Recognition Folder,
# Bruno et al. 2014) activity recognition, trained FROM SCRATCH. Encoder +
# LinearHead trained end-to-end from random init (no pretrained weights).
# WHARF is accelerometer-only (single wrist-worn tri-axial accelerometer,
# native 32 Hz, resampled to the canonical 50 Hz at ingestion — see
# scripts/prepare_wharf_dataset.py), so this uses the acc-only architecture
# variant (shared_kernel: true, 3 sensor channels) — same pattern as the
# Ours(MAE, acc-only) ablation elsewhere in this repo. Comparable to
# vit1d_har_probe_wharf_mae_acconly_multidata_flu.yaml (frozen pretrained
# probe) and deepconvlstm_har_wharf.yaml (literature baseline).
##############################################################################

vit1d:
  patch_size: 16
  shared_kernel: true           # acc-only: no gyro half to split -- single shared Conv1d
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # match the probe/MAE architecture
  max_patches_per_channel: 256
  pooling: "mean"

objective:
  type: supervised

paths:
  dataset_path: /projects/b53017/vbc1591/wharf_dataset.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  window_seconds: 2.56

splits:
  val_ratio: 0.2

data:
  train_on_datasets: ["wharf"]
  sensor_columns: [acc_x, acc_y, acc_z]
  batch_size:       256
  eval_batch_size:  256
  num_workers:      8
  pin_memory:       true

preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-06

trainer:
  seed: 42
  amp: true
  max_steps: 20000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200

  early_stopping:
    enabled: true
    patience: 20

  optim:
    name: adamw
    lr: 1.0e-4                  # full end-to-end training -> lower LR than head-only probing
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false   # only keep best.pt/latest.pt (no per-step snapshots)

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
