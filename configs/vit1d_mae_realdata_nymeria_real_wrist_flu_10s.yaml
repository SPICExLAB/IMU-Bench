vit1d:
  patch_size: 16
  shared_kernel: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
  decoder:
    hidden_size: 192
    num_hidden_layers: 4
    num_attention_heads: 4
  # 10.24 s × 50 Hz / patch_size 16 = 32 patches per channel (fixed window)
  max_patches_per_channel: 32
  pooling: "mean"

objective:
  type: mae_realdata_nymeria_real_wrist_flu
  mask_ratio: 0.75
  mask_strategy: composite        # random | temporal | signal | composite
  mae_realdata_nymeria_real_wrist_flu:
    # Nymeria REAL wrist pkl sessions (FLU frame, real sensor readings)
    train_pkl_root: /mnt/nas2/processed_data_body_Ty_rwrist
    train_files: all
    val_pkl_root: /mnt/nas2/processed_data_test_body_Ty_rwrist
    val_files: all
    add_gravity: true             # keep real IMU gravity component in output acc
    # Real parquet data is pulled from paths.dataset_path filtered by
    # data.train_on_datasets (set in base.yaml):
    #   ["pamap2", "recofit", "samosa", "shoaib", "ut_watch", "utd_mhad", "wisdm"]

windowing:
  window_seconds: 10.24          # fixed 10.24 s window (no variable-length)

data:
  batch_size: 64                 # keep patch-count budget ≈ 2.56 s × batch 256

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
