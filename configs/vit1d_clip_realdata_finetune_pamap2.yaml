# CLIP-style IMU<->text FINETUNE on pamap2, warm-started from the
# HumanML3D-CLIP-finetuned checkpoint (vit1d_clip_humanml3d_finetune_mae_multidata,
# 33.00%/34.25% imu<->text retrieval on HumanML3D itself). Tests whether an
# encoder already aligned to natural-language motion descriptions transfers
# to real-world HAR classification via the same CLIP-alignment mechanism
# (text = "The person is <activity>"), compared directly against UniMTS's
# own finetune on the identical data/split (see prepare_har_data.py +
# finetune_custom.py in baselines/language_alignment/UniMTS/).
#
# Zero-shot sibling: launch_slurm_zeroshot_har_pamap2.sh (same checkpoint,
# no training on pamap2 at all).
#
# Architecture/pretrained_run/objective machinery identical to
# configs/vit1d_clip_humanml3d_flu_finetune_mae_multidata.yaml (the run that
# produced the checkpoint being warm-started here) -- only the data source
# (imu_text_clip_realdata + train_on_datasets) and warm-start source differ.
# Note: pretrained_run only supplies ENCODER weights (imu_text_clip_realdata's
# warm-start path doesn't load clip_head) -- the CLIP projection head is
# freshly initialized and trained from scratch here, which is intentional:
# pamap2's activity-label embedding space is a different target distribution
# than HumanML3D's own captions.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro
  pos_embed_type: 2d
  max_patches_per_channel: 256
  max_channels: 32
  pooling: "mean"

  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true

objective:
  type: imu_text_clip_realdata
  imu_text_clip_realdata:
    clip_model:        openai/clip-vit-base-patch32
    clip_embed_dim:    512
    local_files_only:  true

    pretrained_run:  vit1d_clip_humanml3d_finetune_mae_multidata
    pretrained_ckpt: best

    sentence_template: "The person is {}"

    freeze_imu_encoder:  false  # FINETUNE: encoder warm-started but trainable
    freeze_text_encoder: true
    text_projection_mlp: true
    text_mlp_hidden_dim: null

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  window_seconds: 2.56
  # PAMAP2 has highly variable per-subject gap counts (1-594 observed) due to
  # real-world sensor dropout -- the repo-wide default max_gaps_per_session: 100
  # (base.yaml) rejects every session assigned to val by the random
  # subject-group split, leaving val with 0 windows and a val_loss that never
  # evaluates (early stopping silently never fires -- see
  # configs/vit1d_har_finetune_pamap2_mae_multidata_flu.yaml for the same fix
  # already established elsewhere in this repo). Raised comfortably above the
  # observed max.
  max_gaps_per_session: 700

splits:
  seed: 42
  group_key: subject_id
  shuffle: true
  val_ratio: 0.2
  test_ratio: 0.0

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  train_on_datasets: ["pamap2"]
  batch_size: 64
  eval_batch_size: 64
  num_workers: 4

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 200
  val_max_batches: 100

  optim:
    name: adamw
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 100

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
