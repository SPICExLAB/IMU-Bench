vit1d:
  patch_size: 16                  # 128 / 16 = 8 time patches per channel
  shared_kernel: "acc_gyro"
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    freq_moe_experts: 4              # replace FFN with freq-aware 4-expert soft MoE
    freq_moe_bands:                  # Hz bands — one expert per band
      - [0.0,  1.0]
      - [1.0,  3.0]
      - [3.0,  8.0]
      - [8.0, 25.0]
    freq_moe_fs: 50.0
  decoder:
    hidden_size: 192
    num_hidden_layers: 4
    num_attention_heads: 4
    intermediate_size: 768
  max_patches_per_channel: 256
  pooling: mean
  pos_embed_type: 2d

objective:
  type: mae_realdata_ocdetect_flu
  mask_ratio: 0.75
  mask_strategy: composite           # random / temporal / signal, rotated each sample

  # Frequency-band-weighted loss (lower freq → higher weight)
  freq_mae:
    fs: 50.0
    bands:
      - [0, 1]                       # gravity / DC
      - [1, 3]                       # step cadence fundamentals
      - [3, 8]                       # walking harmonics
      - [8, 25]                      # fine dynamics
    band_weights: [4.0, 3.0, 2.0, 1.0]

  mae_realdata_ocdetect_flu:
    ocdetect_data_dir: /mnt/nas2/yiquan_data/preprocessed
    ocdetect_splits: [0.8, 0.1, 0.1]
    max_ocdetect_hours: 500.0        # cap OCDetect at 500 h to prevent domination

data:
  batch_size: 256
  eval_batch_size: 256
  num_workers: 8
  pin_memory: true

  # Realdata parquet datasets (FLU-style z-norm, no random rotation)
  dataset_column: dataset
  label_column: dataset_activity_id
  label_name_column: dataset_activity_label
  session_column: session_id
  subject_column: subject_id
  time_column: timestamp_ns
  drop_na: false
  train_on_datasets:
    - pamap2
    - recofit
    - samosa
    - shoaib
    - ut_watch
    - utd_mhad
    - wisdm

paths:
  dataset_path: /mnt/nas2/yiquan_data/IMULM_master_dataset_v2.parquet
  runs_root: /home/yiquan/TransfHAR/runs/

# ── Preprocessing: z-norm only, no rotation augmentation ─────────────────────
preprocess:
  filter:
    enabled: true
    type: lowpass
    high_hz: 24
    low_hz: 0.25
    order: 4
  impute:
    enabled: true
    method: linear
    max_missing_frac: 0.2
  normalize:
    enabled: true
    method: zscore
    eps: 1.0e-6

# All augmentations OFF — FLU + z-norm is the only transform
random_rotation:
  enabled: false
axis_bias:
  enabled: false
gain_jitter:
  enabled: false
gaussian_noise:
  enabled: false
time_warp:
  enabled: false

splits:
  group_key: subject_id
  seed: 42
  shuffle: true
  test_ratio: 0
  val_ratio: 0.05

windowing:
  window_seconds: 2.56              # 128 samples @ 50 Hz
  window_hop_ratio: 0.5
  label_policy: center
  majority_threshold: 0.8
  handle_gaps: true
  gap_method: interpolate
  max_gap_ms: 200
  max_gaps_per_session: 100

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 1000

  optim:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 10
    min_delta: 0.0001

logging:
  log_every_steps: 5
  ckpt_every_steps: 5000

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
