vit1d:
  patch_size: 16
  shared_kernel: true
  pos_embed_type: sinusoidal        # required for variable-length generalisation
  max_patches_per_channel: 64       # covers T_max = 512 frames (10.24 s) at 50 Hz
  max_channels: 32
  pooling: "mean"                   # mean-pool over all tokens → [B, D_enc]

  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6

objective:
  type: imu_text_clip
  imu_text_clip:
    # Finetune: warm-start encoder from MAE var-length checkpoint, encoder is TRAINABLE.
    # Both the ViT1D encoder and the ContrastiveCLIPHead are updated.
    pretrained_run:  vit1d_mae_nymeria_var_length
    pretrained_ckpt: best

    # Absolute path to the HumanML3D dataset root (must contain joints/ and texts/).
    humanml3d_root: /home/yiquan/HumanML3D

    # CLIP text encoder (HuggingFace identifier or local path).
    clip_model:        openai/clip-vit-base-patch32
    clip_embed_dim:    512
    freeze_text_encoder: true    # text encoder always frozen
    freeze_imu_encoder:  false   # FINETUNE: encoder is trainable

    # Set to true if the CLIP model has been downloaded and should not be re-fetched.
    local_files_only: true

    # Optional: path to a pre-computed text embedding cache produced by
    #   python scripts/cache_clip_text_embeddings.py \
    #       --humanml3d-root /home/yiquan/HumanML3D \
    #       --out            /home/yiquan/HumanML3D/clip_text_emb_cache.pt
    # When set, the CLIP text model is NOT loaded during training — the cached
    # L2-normalised embeddings are looked up in the DataLoader instead.
    # Set to null to disable (default behaviour: run CLIP text encoder live).
    text_cache_path: /home/yiquan/HumanML3D/clip_text_emb_cache.pt

# Windowing: window length T is sampled uniformly from [T_min, T_max] each batch
# (multiples of patch_size = 16 at 50 Hz).
windowing:
  min_window_seconds: 1.28    # T_min =  64 frames =  4 patches
  max_window_seconds: 10.24   # T_max = 512 frames = 32 patches

data:
  # Sensor columns (must match the 6 channels derived by humanml3d_dataset.py)
  sensor_columns: ["acc_x", "acc_y", "acc_z", "gyro_x", "gyro_y", "gyro_z"]
  batch_size: 64
  num_workers: 4

trainer:
  val_max_batches: 100   # cap val at 100 batches — val loader is infinite
  seed: 42
  amp: true
  max_steps: 5000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500

  optim:
    name: adamw
    lr: 0.00005          # lower LR to preserve pretrained MAE encoder features
    weight_decay: 0.0001
    betas: [0.9, 0.98]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20
