# Same as vit1d_beit_ocdetect_anyrot_nopooling_8lvl but with 40% masking ratio.
# Lower masking gives the encoder more context per window — easier task, potentially
# better low-level feature quality at the cost of less aggressive self-supervision.

vit1d:
  patch_size: 16
  shared_kernel: "acc_gyro"
  use_cls_token: true
  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    drop_path_rate: 0.1

objective:
  type: beit_ocdetect_anyrot_nopooling_8lvl
  beit_ocdetect_anyrot_nopooling_8lvl:
    tokenizer_run: runs/vit1d_rvq_tokenizer_ocdetect_anyrot_nopooling_8lvl
    num_levels: 8
    num_codes: 1024
    mask_ratio: 0.40
    mask_strategy: composite
    splits: [0.8, 0.1, 0.1]
    apply_flu_transform: false

random_rotation:
  enabled: true

time_crop:
  enabled: true
  min_crop_ratio: 0.90

gaussian_noise:
  enabled: true
  sigma: 0.01

data:
  batch_size: 256
  eval_batch_size: 256
  num_workers: 4
  pin_memory: true

logging:
  ckpt_every_steps: 5000

trainer:
  seed: 42
  amp: true
  max_steps: 300000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500

  optim:
    name: adamw
    lr: 0.0003
    weight_decay: 0.05
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 5000

  early_stopping:
    enabled: false
    monitor: val_loss
    patience: 20
