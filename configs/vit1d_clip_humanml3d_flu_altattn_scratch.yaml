# IMU<->text CLIP alignment on HumanML3D, trained FROM SCRATCH.
# Encoder + ContrastiveCLIPHead trained end-to-end from random init (no
# pretrained weights). Same architecture as the frozen MAE probe
# (vit1d_clip_humanml3d_flu_probe_mae_multidata.yaml) so the two are directly
# comparable — this is the "no self-supervised pretraining" baseline.
# Text side still uses the pre-cached, frozen CLIP text embedding.

vit1d:
  patch_size: 16
  shared_kernel: acc_gyro       # match the probe/MAE architecture
  pos_embed_type: 2d
  max_patches_per_channel: 256
  max_channels: 32
  pooling: "mean"

  encoder:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    layer_norm_eps: 1.0e-6
    alt_attention: true         # match the probe/MAE architecture

objective:
  type: imu_text_clip_flu
  imu_text_clip_flu:
    # No pretrained_run — fully supervised from random init
    freeze_imu_encoder:  false  # encoder trains jointly with the CLIP projection head
    freeze_text_encoder: true

    humanml3d_root: /projects/b53017/vbc1591/HumanML3D
    clip_model:     openai/clip-vit-base-patch32
    clip_embed_dim: 512
    local_files_only: true
    text_cache_path: /projects/b53017/vbc1591/HumanML3D/clip_text_emb_cache.pt

paths:
  dataset_path: /projects/b53017/vbc1591/IMULM_master_dataset_v2.parquet
  runs_root: /gpfs/home/vbc1591/IMU-SSL/runs

windowing:
  min_window_seconds: 1.28
  max_window_seconds: 10.24

data:
  sensor_columns: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  batch_size: 64
  num_workers: 4

trainer:
  seed: 42
  amp: true
  max_steps: 10000000
  grad_clip_norm: 1.0
  grad_accum_steps: 1
  val_every_steps: 500
  val_max_batches: 100

  optim:
    name: adamw
    lr: 1.0e-4                  # full end-to-end training -> lower LR than head-only probing
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  sched:
    name: cosine
    warmup_steps: 200

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 20

logging:
  log_every_steps: 5
  ckpt_every_steps: 500
  save_step_checkpoints: false

wandb:
  entity: yli32258-northwestern-university
  project: TransfHAR_project
